<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسوية جردية - مخازن غذائية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/lovable-data/theme.css">
  <script src="/lovable-data/theme.js"></script>
</head>
<body class="bg-light">
  <script src="include-navbar.js"></script>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">قائمة فروق الجرد</h2>
      <div class="w-25"><label class="form-label small">المخزن</label><select id="reconcileSection" class="form-select section-select"><option value="">كل الأقسام</option></select></div>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-striped align-middle text-center exportable-table">
          <thead class="table-light">
            <tr>
              <th>كود الصنف</th>
              <th>اسم الصنف</th>
              <th>الرصيد الدفتري</th>
              <th>الرصيد الفعلي</th>
              <th>الفرق</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="reconcileBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
  <script src="sections.js"></script>
  <script src="inventory-reconcile.js"></script>
</body>
</html>
