<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل الموردين - مخازن غذائية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/lovable-data/theme.css">
  <script src="/lovable-data/theme.js"></script>
</head>
<body class="bg-light">
  <script src="include-navbar.js"></script>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-truck"></i> دليل الموردين</h2>
      <button id="addSupplierBtn" class="btn btn-primary">إضافة مورد جديد</button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm table-bordered align-middle exportable-table">
            <thead class="table-light">
              <tr>
                  <th>كود المورد</th>
                  <th>الاسم</th>
                  <th>الهاتف</th>
                  <th>البريد الإلكتروني</th>
                  <th>العنوان</th>
                  <th>ملاحظات</th>
                  <th>رقم البطاقة الضريبية</th>
                  <th style="width:160px;">الإجراءات</th>
                </tr>
            </thead>
            <tbody id="suppliersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
  <script src="suppliers.js"></script>
</body>
</html>
