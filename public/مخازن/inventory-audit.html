<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جرد المخزون - مخازن غذائية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/mobile.css" data-ledoux-mobile="1" />
  <script src="/mobile.js"></script>
</head>
<body class="bg-light">
  <script src="include-navbar.js"></script>

  <div class="container mt-5">
    <div class="d-flex justify-content-end mb-3 w-50">
      <div class="w-50 ms-auto"><label class="form-label small">المخزن</label><select id="auditSection" class="form-select section-select"><option value="">كل الأقسام</option></select></div>
    </div>
    <div class="card shadow">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">محضر جرد مخزني - تاريخ: <span id="auditDate">2026-01-03</span></h5>
        <span class="badge bg-warning text-dark">حالة الجرد: قيد التنفيذ</span>
      </div>
      <div class="card-body">
        <div class="alert alert-info">إدخل الكميات الفعلية المكتشفة على الرفوف لتصحيح بيانات النظام.</div>

        <table class="table table-bordered table-striped align-middle exportable-table">
          <thead class="table-light text-center">
            <tr>
              <th>كود الصنف</th>
              <th>اسم الصنف</th>
              <th>الرصيد الدفتري (النظام)</th>
              <th style="width: 20%;">الرصيد الفعلي (الواقع)</th>
              <th>الفرق</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="auditRows"></tbody>
        </table>
      </div>
      <div class="card-footer text-start">
        <button id="saveAuditDraft" class="btn btn-secondary">حفظ مسودة</button>
        <button id="finalizeAudit" class="btn btn-primary">اعتماد الجرد وإنشاء قيد تسوية</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
  <script src="sections.js"></script>
  <script src="inventory-audit.js"></script>
</body>
</html>
