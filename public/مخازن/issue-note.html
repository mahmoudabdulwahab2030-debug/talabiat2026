<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أذن صرف - مخازن غذائية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <script src="include-navbar.js"></script>

  <div class="container mt-5">
    <h2 class="mb-4 text-danger"><i class="bi bi-box-arrow-up"></i> أذن صرف (تسجيل صادر)</h2>

    <div class="card shadow-sm p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">رقم إذن الصرف</label>
          <div class="input-group">
            <input id="issueNumber" type="text" class="form-control" value="OUT-2026-042">
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label">تاريخ الخروج</label>
          <input id="issueDate" type="date" class="form-control" value="2026-01-03">
        </div>
        <div class="col-md-4">
          <label class="form-label">الجهة المستلمة (العميل/الفرع)</label>
          <select id="issueRecipient" class="form-select section-select" data-section-picker>
            <option value="">جارٍ تحميل الأقسام...</option>
          </select>
          <div class="form-text">اضغط F1 لفتح قائمة الأقسام</div>
        </div>
        <div class="col-md-2">
          <label class="form-label">أمين المخزن</label>
          <input id="issueKeeper" type="text" class="form-control" value="أحمد محمد">
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle text-center mb-0 exportable-table">
          <thead class="table-danger">
            <tr>
              <th>الصنف</th>
              <th>الرصيد الحالي</th>
              <th>الكمية المطلوبة</th>
              <th>سعر الوحدة</th>
              <th>الإجمالي</th>
              <th>#</th>
            </tr>
          </thead>
          <tbody id="outboundRows">
            <tr>
              <td><input type="text" class="form-control product-search" placeholder="أدخل اسم الصنف أو الكود"></td>
              <td><span class="badge bg-secondary row-current">-</span></td>
              <td><input type="number" class="form-control text-center row-qty" value="1"></td>
              <td class="row-price">0.00</td>
              <td class="row-total">0.00</td>
              <td><button class="btn btn-outline-danger btn-sm remove-row"><i class="bi bi-trash"></i></button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between">
        <button id="addOutboundRowBtn" class="btn btn-outline-dark"><i class="bi bi-plus-circle"></i> إضافة صنف آخر</button>
        <div>
          <button id="issueListBtn" type="button" class="btn btn-outline-primary me-2">طلبات الصرف</button>
          <button id="postOutboundBtn" class="btn btn-danger px-5">تأكيد الصرف وتحديث المخزن</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
  <script src="sections.js"></script>
  <script src="outbound.js"></script>
  <!-- Requisition list modal -->
  <div class="modal fade" id="requisitionListModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">بحث طلبات الصرف</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <div class="input-group">
                <input id="reqSearchNumber" class="form-control" placeholder="رقم الطلب (أرقام فقط)">
                <button id="reqSearchByNumberBtn" class="btn btn-outline-secondary">بحث بالرقم</button>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group">
                <input id="reqSearchDate" type="date" class="form-control">
                <button id="reqSearchByDateBtn" class="btn btn-outline-secondary">بحث بالتاريخ</button>
              </div>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover">
              <thead><tr><th>الرقم</th><th>مقدم الطلب</th><th>التاريخ</th><th>عدد البنود</th><th>#</th></tr></thead>
              <tbody id="reqSearchResults"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Issue success modal -->
  <div class="modal fade" id="issueSuccessModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">تم تأكيد الصرف</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="issueSuccessBody">
          <!-- summary inserted here -->
        </div>
        <div class="modal-footer">
          <button id="printIssueBtn" type="button" class="btn btn-outline-primary">طباعة</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
