<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO7ETTA7KOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .clickable-card { cursor: pointer; transition: transform .08s ease; }
        .clickable-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
    </style>
  <link rel="stylesheet" href="/lovable-data/theme.css">
  <script src="/lovable-data/theme.js"></script>
</head>
    <body class="bg-light" data-no-export-attach="true">
      <script src="include-navbar.js"></script>
    <!-- navbar is injected by include-navbar.js -->

    <div class="container">
        <h2 class="mb-4">LO7ETTA7KOM</h2>
        
        <!-- Statistics Cards -->
        <div class="row g-4">
            <div class="col-md-3">
                <div id="cardTotalProducts" class="card text-white bg-primary shadow clickable-card" role="button">
                    <div class="card-body">
                        <h5 class="card-title">إجمالي الأصناف</h5>
                        <p id="totalProducts" class="card-text fs-2">-</p>
                        <div class="small text-white-50">اضغط للعرض</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div id="cardInboundToday" class="card text-white bg-success shadow clickable-card" role="button">
                    <div class="card-body">
                        <h5 class="card-title">حركات الوارد (اليوم)</h5>
                        <p id="inboundToday" class="card-text fs-2">-</p>
                        <div class="small text-white-50">اضغط للعرض</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div id="cardExpiredCount" class="card text-white bg-danger shadow clickable-card" role="button">
                    <div class="card-body">
                        <h5 class="card-title">أصناف منتهية</h5>
                        <p id="expiredCount" class="card-text fs-2">-</p>
                        <div class="small text-white-50">اضغط للعرض</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div id="cardStockValue" class="card text-white bg-warning shadow clickable-card" role="button">
                    <div class="card-body">
                        <h5 class="card-title">قيمة المخزون</h5>
                        <p id="stockValue" class="card-text fs-2">-</p>
                        <div class="small text-white-50">اضغط للعرض</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Activities Table -->
        <div class="mt-5 card shadow-sm">
            <div class="card-header bg-white"><strong>آخر التحركات</strong></div>
            <div class="card-body">
                <table class="table table-hover exportable-table">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>نوع العملية</th>
                            <th>اسم الصنف</th>
                            <th>الكمية</th>
                        </tr>
                    </thead>
                            <tbody id="recentMovements">
                      <tr><td colspan="4" class="text-muted">تحميل آخر التحركات...</td></tr>
                    </tbody>
                </table>
                <!-- Export/Print Controls -->
                <div id="recentMovementsControls" class="mt-3 d-flex justify-content-start gap-2">
                    <button id="printRecentMovements" class="btn btn-sm btn-outline-secondary"><i class="bi bi-printer"></i> طباعة</button>
                    <button id="exportRecentMovementsPdf" class="btn btn-sm btn-outline-primary"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
                    <button id="exportRecentMovementsExcel" class="btn btn-sm btn-outline-success"><i class="bi bi-file-earmark-spreadsheet"></i> Excel</button>
                </div>
            </div>
        </div>
    </div>

  <!-- Overview modal -->
  <div class="modal fade" id="overviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="overviewModalTitle">تفاصيل</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div><strong id="overviewSubtitle"></strong></div>
          <div class="table-responsive">
            <table class="table table-sm table-striped">
              <thead id="overviewHead"></thead>
              <tbody id="overviewBody"></tbody>
            </table>
          </div>
          <div id="overviewControls" class="mt-3 d-flex justify-content-start gap-2">
            <button id="printOverview" class="btn btn-sm btn-outline-secondary"><i class="bi bi-printer"></i> طباعة</button>
            <button id="exportOverviewPdf" class="btn btn-sm btn-outline-primary"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
            <button id="exportOverviewExcel" class="btn btn-sm btn-outline-success"><i class="bi bi-file-earmark-spreadsheet"></i> Excel</button>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button></div>
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="exports.js"></script>
    <script src="app.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
