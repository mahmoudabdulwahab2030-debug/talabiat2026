<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بيست سويت - فرع العبور ماركت - تحميل الطلبات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .content-wrapper{max-width:1200px;margin:auto;padding:20px}.controls-section,.table-wrapper{background:linear-gradient(135deg,#2c2c2c,#3a2f1d);border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 5px 15px #0003}.form-row,.buttons-container{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.form-group{flex:1;min-width:220px}.form-group label{display:block;margin-bottom:8px;color:#ffd166;font-weight:bold}.form-group input,.form-group select{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff1a;background:#0003;color:#fff}.action-button{padding:12px 24px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.primary{background:linear-gradient(135deg,#ffd166,#f0ad4e);color:#000}.secondary{background:#ffffff1a;color:#fff}.data-table{width:100%;border-collapse:collapse}.data-table th{background:#2c2c2c;color:#ffd166;padding:12px}.data-table td{padding:10px;text-align:center;border:1px solid #ffffff1a}.qty-input{width:80px;text-align:center;padding:5px;border-radius:4px;background:#2c2c2c;color:#fff;border:1px solid #444}.folder-box{text-align:center;padding:18px;background:#ffffff1a;border-radius:12px}.folder-box input{display:none}.modal-overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:1000}.catalog-modal{background:#202020;padding:20px;border-radius:16px;width:95%;max-width:900px;max-height:85vh;overflow:auto}.catalog-table{width:100%;border-spacing:0 8px}.catalog-table td,.catalog-table th{padding:10px;text-align:center}.add-item-btn{padding:8px;border:0;border-radius:8px;background:#ffd166;cursor:pointer}
  </style>
  <script src="/lovable-data/branches-registry.js"></script>
</head>
<body>
  <main class="content-wrapper">
    <h2>📥 بيست سويت - فرع العبور ماركت - رفع البيانات إلى Firestore</h2>
    <section class="controls-section">
      <div class="folder-box"><label for="excelFile">📁 اختر ملف Excel<input type="file" id="excelFile" accept=".xlsx,.xls"></label></div>
      <div class="form-row"><div class="form-group"><label for="orderDate">🗓️ تاريخ الطلبية:</label><input type="date" id="orderDate"></div><div class="form-group"><label for="sheetSelector">🧾 اختر القسم:</label><select id="sheetSelector" disabled></select></div></div>
      <div class="buttons-container"><button id="uploadBtn" disabled class="action-button primary">☁️ رفع القسم المحدد</button><button id="uploadAllBtn" disabled class="action-button secondary">🚀 رفع كل الأقسام</button><button onclick="showLoadDialog()" class="action-button secondary">📂 استدعاء طلبية سابقة</button></div>
    </section>
    <div id="status" class="status-message"></div><div class="table-wrapper"><div id="tableContainer"></div></div>
    <section id="editSection" style="display:none"><h3>تعديل طلبية بتاريخ: <span id="editDate"></span></h3><button onclick="addNewItem()" class="action-button secondary">➕ إضافة صنف من الكتالوج</button><button onclick="saveChanges()" class="action-button primary">💾 حفظ التعديلات</button><div id="editTable" class="table-wrapper"></div></section>
  </main>
  <script>
    const firebaseConfig={apiKey:'AIzaSyA5nOr7oPJQydnZTUULmf2YxE33ppYz2Gw',authDomain:'ledoux-80b46.firebaseapp.com',projectId:'ledoux-80b46',storageBucket:'ledoux-80b46.appspot.com',messagingSenderId:'1020769543389',appId:'1:1020769543389:web:fc083525fd9675d9f86734'};
    firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
    const BRANCH='best_sweet_obour_market',ORDERS_COLLECTION='orders_best_sweet';let workbookData={},currentData=[],currentSheetName='',editingData=[],isUploading=false;
    const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    function setBusy(value){isUploading=value;[$('uploadBtn'),$('uploadAllBtn')].forEach(button=>{if(button)button.disabled=value;});}
    function docId(item,date){return [BRANCH,date,item.sheet,item.code,item.name,item.rowIdx].map(v=>String(v||'').trim().toLowerCase().replace(/[^a-z0-9_.-]+/g,'_')).filter(Boolean).join('__').slice(0,150)||db.collection(ORDERS_COLLECTION).doc().id;}
    function renderRows(rows,sheet){const valid=rows.slice(1).filter(row=>(Number(row[2])||0)>0);currentData=valid.map((row,rowIdx)=>({code:row[0]||'',name:row[1]||'',qty:Number(row[2])||0,notes:String(row[3]??""),sheet,rowIdx}));$('tableContainer').innerHTML=currentData.length?`<table class="data-table"><thead><tr><th>📄 الكود</th><th>📦 الصنف</th><th>🔢 الكمية</th><th>📝 ملاحظات</th></tr></thead><tbody>${currentData.map(item=>`<tr><td>${esc(item.code)}</td><td>${esc(item.name)}</td><td>${item.qty}</td><td>${esc(item.notes)}</td></tr>`).join('')}</tbody></table>`:'<p>⚠️ لا توجد بيانات قابلة للعرض.</p>';}
    $('excelFile').addEventListener('change',event=>{const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const book=XLSX.read(new Uint8Array(e.target.result),{type:'array'});workbookData={};book.SheetNames.forEach(name=>workbookData[name]=XLSX.utils.sheet_to_json(book.Sheets[name],{header:1}));$('sheetSelector').innerHTML=Object.keys(workbookData).map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');$('sheetSelector').disabled=$('uploadBtn').disabled=$('uploadAllBtn').disabled=false;currentSheetName=$('sheetSelector').value;renderRows(workbookData[currentSheetName],currentSheetName);Swal.fire('تم','تمت قراءة ملف Excel','success');}catch(error){console.error(error);Swal.fire('خطأ','فشل قراءة ملف Excel','error');}};reader.readAsArrayBuffer(file);});
    $('sheetSelector').addEventListener('change',event=>{currentSheetName=event.target.value;renderRows(workbookData[currentSheetName],currentSheetName);});
    async function uploadItems(items,date){const batch=db.batch();items.forEach(item=>batch.set(db.collection(ORDERS_COLLECTION).doc(docId(item,date)),{...item,branch:BRANCH,orderDate:date,uploadedBy:(localStorage.getItem('username')||localStorage.getItem('userCode')||'غير معروف'),timestamp:firebase.firestore.FieldValue.serverTimestamp()}));await batch.commit();}
    $('uploadBtn').addEventListener('click',async()=>{const date=$('orderDate').value;if(!date||!currentData.length)return Swal.fire('تنبيه','اختر التاريخ وتأكد من وجود بيانات','warning');if(isUploading)return;setBusy(true);try{const snap=await db.collection(ORDERS_COLLECTION).where('branch','==',BRANCH).where('orderDate','==',date).get();if(!snap.empty){const result=await Swal.fire({title:'توجد بيانات لهذا التاريخ',text:'هل تريد استبدالها؟',icon:'question',showCancelButton:true,confirmButtonText:'استبدال',cancelButtonText:'إلغاء'});if(!result.isConfirmed)return;const batch=db.batch();snap.forEach(doc=>batch.delete(doc.ref));await batch.commit();}await uploadItems(currentData,date);try{if(window.activityLogger)activityLogger.logActivity('upload_all',window.location.pathname,{branch:BRANCH,orderDate:date,rows:currentData.length});}catch(error){console.warn('activity log failed',error);}$('status').textContent=`✅ تم حفظ ${currentData.length} صف بتاريخ ${date}`;Swal.fire('نجاح','تم الرفع','success');}catch(error){console.error(error);Swal.fire('خطأ','فشل رفع البيانات','error');}finally{setBusy(false);}});
    $('uploadAllBtn').addEventListener('click',async()=>{const date=$('orderDate').value;if(!date)return Swal.fire('تنبيه','حدد التاريخ','warning');if(isUploading)return;setBusy(true);try{const old=await db.collection(ORDERS_COLLECTION).where('branch','==',BRANCH).where('orderDate','==',date).get(),batch=db.batch();old.forEach(doc=>batch.delete(doc.ref));await batch.commit();let count=0;for(const [sheet,rows] of Object.entries(workbookData)){const items=rows.slice(1).map((row,rowIdx)=>({code:row[0]||'',name:row[1]||'',qty:Number(row[2])||0,notes:String(row[3]??""),sheet,rowIdx})).filter(item=>item.code&&item.name&&item.qty>0);await uploadItems(items,date);count+=items.length;}try{if(window.activityLogger)activityLogger.logActivity('upload_all',window.location.pathname,{branch:BRANCH,orderDate:date,rows:count});}catch(error){console.warn('activity log failed',error);}$('status').textContent=`✅ تم رفع ${count} صف`;Swal.fire('نجاح',`تم رفع ${count} صف`,'success');}catch(error){console.error(error);Swal.fire('خطأ','فشل رفع البيانات','error');}finally{setBusy(false);}});
    async function showLoadDialog(){if(!(await EditAudit.verify()))return;const dateResult=await Swal.fire({title:'اختر التاريخ',input:'date',showCancelButton:true,confirmButtonText:'استدعاء'});if(dateResult.value)loadOrderForEdit(dateResult.value);}
    async function loadOrderForEdit(date){const snap=await db.collection(ORDERS_COLLECTION).where('branch','==',BRANCH).where('orderDate','==',date).get();if(snap.empty)return Swal.fire('تنبيه','لا توجد طلبية','info');editingData=[];snap.forEach(doc=>editingData.push({id:doc.id,...doc.data()}));$('editDate').textContent=date;$('editSection').style.display='block';renderEditTable();}
    function renderEditTable(){$('editTable').innerHTML=editingData.length?`<table class="data-table"><thead><tr><th>الكود</th><th>الصنف</th><th>الكمية</th><th>ملاحظات</th><th>حذف</th></tr></thead><tbody>${editingData.map((item,index)=>`<tr><td>${esc(item.code)}</td><td>${esc(item.name)}</td><td><input class="qty-input" type="number" min="0" value="${Number(item.qty)||0}" onchange="editingData[${index}].qty=Number(this.value)||0"></td><td><input class="qty-input" type="text" value="${esc(item.notes)}" style="width:100%;min-width:140px;padding:5px;" oninput="editingData[${index}].notes=this.value" aria-label="ملاحظات الصنف" placeholder="أضف ملاحظة..."></td><td><button class="action-button secondary" onclick="editingData.splice(${index},1);renderEditTable()">🗑️</button></td></tr>`).join('')}</tbody></table>`:'<p>لا توجد عناصر للتعديل.</p>';}
    async function saveChanges(){const date=$('editDate').textContent;if(!date||!editingData.length)return;const batch=db.batch(),old=await db.collection(ORDERS_COLLECTION).where('branch','==',BRANCH).where('orderDate','==',date).get();old.forEach(doc=>batch.delete(doc.ref));editingData.filter(item=>item.name&&(Number(item.qty)||0)>0).forEach(item=>batch.set(db.collection(ORDERS_COLLECTION).doc(),{code:item.code||'',name:item.name,qty:Number(item.qty)||0,notes:String(item.notes??""),sheet:item.sheet||'',branch:BRANCH,orderDate:date,uploadedBy:(localStorage.getItem('username')||localStorage.getItem('userCode')||'غير معروف'),timestamp:firebase.firestore.FieldValue.serverTimestamp()}));await batch.commit();$('editSection').style.display='none';Swal.fire('تم','تم حفظ التعديلات','success');}
    async function addNewItem(){const snap=await db.collection('catalog').get();if(snap.empty)return Swal.fire('تنبيه','لا يوجد كتالوج','info');const modal=document.createElement('div');modal.className='modal-overlay';modal.innerHTML='<div class="catalog-modal"><h3>📋 اختر صنفًا</h3><div id="catalogItems"></div><button class="action-button secondary" onclick="this.closest(\'.modal-overlay\').remove()">إغلاق</button></div>';document.body.appendChild(modal);const container=modal.querySelector('#catalogItems');snap.forEach(section=>{(section.data().items||[]).forEach(item=>{const button=document.createElement('button');button.className='add-item-btn';button.textContent=`➕ ${item.name}`;button.onclick=()=>{editingData.push({code:item.code||'',name:item.name,qty:1,notes:"",sheet:section.id});modal.remove();renderEditTable();};container.appendChild(button);});});}
  </script>
  <script src="activity-logger.js"></script>
<script src="/lovable-data/edit-audit.js"></script>
<script>EditAudit.init({collection:'orders_best_sweet',branch:'best_sweet_obour_market'});</script>
</body>
</html>
