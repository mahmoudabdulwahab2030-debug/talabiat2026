<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>بيست سويت - إدارة الطلبات</title>
  <link href="style.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Cairo:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --bg-1: #141416;
      --bg-2: #1b1c20;
      --panel: #1f2024;
      --accent: #ff3b55;
      --accent-2: #ffb300;
      --muted: #9aa0a6;
      --glass: rgba(255,42,77,0.06);
      --surface-contrast: rgba(255,255,255,0.04);
      --shadow: 0 6px 30px rgba(0,0,0,0.6);
      --max-width: 1400px;
    }
    /* ثيم دارك احترافي مع الأحمر الغامق والرصاصي */
    body {
      background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-1) 100%);
      color: #e9ecef;
      font-family: 'Cairo', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      transition: background 0.5s cubic-bezier(.4,0,.2,1);
    }
    .container {
      background: linear-gradient(180deg,var(--panel), #151516 120%);
      margin: 24px auto;
      padding: 26px;
      border-radius: 16px;
      max-width: var(--max-width);
      box-shadow: 0 2px 24px #000a;
      animation: fadeInUp 0.7s cubic-bezier(.4,0,.2,1);
      border: 1px solid var(--surface-contrast);
      position: relative;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }
    h2 {
      color: #ff2a4d;
      text-align: center;
      margin-bottom: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #000a;
    }
    .form-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    /* infographics row (animated counters) */
    .infographics {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin: 12px 0 18px 0;
    }
    .infographic-card{
      flex: 1 1 180px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--surface-contrast);
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      box-shadow: var(--shadow);
      display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
      transition: transform .28s ease, box-shadow .28s ease;
    }
    .infographic-card:hover{ transform: translateY(-6px); box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    .infographic-title{ font-size:0.9rem; color:var(--muted); margin-bottom:6px }
    .infographic-value{ font-size:1.6rem; font-weight:800; color:var(--accent-2); }

    /* Sticky actions toolbar above table */
    .actions-row {
      display: none;
    }
    .floating-actions-group {
      position: fixed;
      top: 72px;
      left: 14px;
      z-index: 1400;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .main-group-btn {
      width: 52px;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.3rem;
      padding: 0;
      background: linear-gradient(90deg, #ff2a4d 40%, #ffb300 100%);
      border: 2px solid #fff;
      color: #121212;
      box-shadow: 0 10px 28px rgba(0,0,0,0.32);
    }
    .group-menu {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(18,18,20,0.95);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
      min-width: 60px;
    }
    .group-menu.open {
      display: flex;
    }
    .group-menu button {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.2rem;
      margin: 0;
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(90deg, #2c2c33 40%, #18181c 100%);
      color: #fff;
    }
    .group-menu button:hover {
      transform: translateY(-1px);
      border-color: #ff2a4d;
      box-shadow: 0 6px 18px rgba(255,59,85,0.18);
    }
    .analysis-panel.hidden {
      display: none !important;
    }
    @media (max-width: 900px) {
      .floating-actions-group {
        top: auto;
        bottom: 14px;
        right: 14px;
      }
    }
    .form-group {
      flex: 1;
      min-width: 200px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #ff2a4d;
      font-weight: bold;
    }
    select, input[type="date"], input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      background: #23232a;
      border: 2px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 0 0 #ff2a4d;
    }
    select:focus, input:focus {
      border-color: #ff2a4d;
      box-shadow: 0 0 8px 2px #ff2a4d88;
      animation: outlinePulse 1.2s infinite;
    }
    @keyframes outlinePulse {
      0% { box-shadow: 0 0 0 0 #ff2a4d88; }
      50% { box-shadow: 0 0 8px 2px #ff2a4d88; }
      100% { box-shadow: 0 0 0 0 #ff2a4d88; }
    }
    .actions-row {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }
    button {
      background: linear-gradient(90deg, #3a3b3c 60%, #23232a 100%);
      color: #fff;
      border: 2px solid #ff2a4d;
      padding: 8px 18px;
      margin: 4px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 2px 8px #0004;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.18s cubic-bezier(.4,0,.2,1), border-color 0.3s;
      outline: none;
      position: relative;
      overflow: hidden;
    }
    button:hover, button:focus {
      background: linear-gradient(90deg, #ff2a4d 60%, #ffb300 100%);
      color: #23232a;
      box-shadow: 0 8px 32px #ff2a4d44, 0 2px 12px #0004;
      transform: translateY(-2px) scale(1.04) rotate(-1deg);
      border-color: #ffb300;
      animation: outlinePulse 1.2s infinite;
    }
    table {
      width: 100%;
      max-width: calc(var(--max-width) - 40px);
      border-collapse: collapse;
      margin: 20px 0;
      background: #23232a;
      border-radius: 16px;
      overflow: auto;
      box-shadow: 0 4px 32px #0008;
      table-layout: auto;
      animation: fadeInTable 0.7s cubic-bezier(.4,0,.2,1);
      border: 2px solid #ff2a4d;
    }
    @keyframes fadeInTable {
      from { opacity: 0; transform: scale(0.98);}
      to { opacity: 1; transform: scale(1);}
    }
    th, td {
      border: 1.5px solid #444;
      padding: 14px 12px;
      text-align: center;
      vertical-align: middle;
      white-space: pre-line;
      word-break: break-word;
      font-size: 1.08em;
      transition: background 0.25s, color 0.25s;
      min-width: 120px;
      max-width: 600px;
    }
    /* difference cell styling */
    .diff-cell {
      font-weight: 800;
      color: #e9ecef;
      background: transparent;
      transition: background 0.24s, color 0.24s;
      text-align: center;
      min-width: 110px;
    }
    .diff-cell.negative {
      background: linear-gradient(90deg, rgba(231,76,60,0.14), rgba(231,76,60,0.06));
      color: #ffdddd;
      border-radius: 6px;
      box-shadow: inset 0 -2px 8px rgba(0,0,0,0.25);
    }
    .section-footer-row td {
      background: rgba(35, 50, 90, 0.15);
      color: #c4d8ff;
      font-weight: bold;
      text-align: right;
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .section-add-item-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(30, 60, 145, 0.92);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .section-add-item-btn:hover {
      transform: translateY(-1px);
      background: rgba(58, 96, 186, 0.98);
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
    }
    th {
      background: linear-gradient(90deg, #444 60%, #23232a 100%);
      color: #ff2a4d;
      font-weight: bold;
      font-size: 1.1em;
      border-bottom: 2.5px solid #ff2a4d;
      letter-spacing: 0.5px;
      transition: background 0.25s, color 0.25s;
      position: relative;
    }
    tr {
      transition: background 0.25s;
    }
    tr:nth-child(even) {
      background: #292929;
    }
    tr:nth-child(odd) {
      background: #23272b;
    }
    tr:hover td {
      background: rgba(255,255,255,0.02);
      color: var(--accent-2);
      transition: background 0.25s, color 0.25s;
      border-color: #ff2a4d;
      animation: outlinePulse 1.2s infinite;
    }
    /* subtle pulsing accent for interactive elements */
    @keyframes pulseAccent { 0%{ box-shadow: 0 0 0 0 rgba(255,59,85,0.12);}50%{ box-shadow: 0 0 30px 6px rgba(255,59,85,0.02);}100%{ box-shadow: 0 0 0 0 rgba(255,59,85,0.00);} }
    /* نافذة الجدول العائم */
    #floating-table-modal {
      display: none;
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      margin: auto;
      z-index: 9999;
      max-width: 98vw;
      background: #23232a;
      border-radius: 18px;
      box-shadow: 0 8px 40px #000b;
      padding: 24px 12px 18px 12px;
      border: 2px solid #ff2a4d;
      animation: fadeInUp 0.5s cubic-bezier(.4,0,.2,1);
    }
    #close-floating-table {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff2a4d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 18px;
      font-size: 1.1em;
      cursor: pointer;
      z-index: 10001;
      transition: background 0.2s;
    }
    #close-floating-table:hover {
      background: #ffb300;
      color: #23232a;
    }
    /* Responsive for mobile */
    button.mobile-only {
      display: none;
    }
    @media (max-width: 700px) {
      .container {
        padding: 8px;
        margin: 10px auto;
        max-width: 99vw;
      }
      table, th, td {
        font-size: 12px;
      }
      th, td {
        min-width: 60px;
        padding: 8px 4px;
      }
      button {
        width: 100%;
        font-size: 1em;
      }
      table {
        display: block;
        overflow-x: auto;
        width: 100%;
        min-width: 320px;
      }
      #floating-table-modal {
        max-width: 99vw;
        padding: 10px 2px 10px 2px;
        left: 1vw;
        right: 1vw;
      }
      button.mobile-only {
        display: inline-block;
        width: auto;
      }
    }
    @media (max-width: 400px) {
      .container {
        padding: 2px;
      }
      th, td {
        font-size: 10px;
        padding: 4px 2px;
      }
      #floating-table-modal {
        padding: 4px 1px 4px 1px;
      }
    }
    /* أوتلاين متحرك للعناصر التفاعلية */
    input:focus, select:focus, button:focus {
      outline: none;
      border-color: #ff2a4d;
      box-shadow: 0 0 8px 2px #ff2a4d88;
      animation: outlinePulse 1.2s infinite;
    }
    /* analysis panel (left side) — dark style matching the page */
    .analysis-panel {
      position: fixed;
      left: 12px;
      top: 110px;
      width: 320px;
      max-height: calc(100vh - 160px);
      overflow: auto;
      z-index: 1300;
      background: linear-gradient(180deg, rgba(20,20,22,0.96), rgba(14,14,16,0.98));
      border: 1px solid rgba(255,255,255,0.04);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      font-family: 'Cairo', Arial, sans-serif;
      color: #e9ecef;
      backdrop-filter: blur(4px);
    }
    .analysis-panel h4{ margin:6px 0 10px 0; color: #e9ecef; font-size:1rem }
    .analysis-card{ background: linear-gradient(180deg,#151517,#1b1c1f); border-radius:10px; padding:10px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.03); }
    .analysis-card .title{ font-weight:800; color:#f5f5f5; }
    .analysis-card .value{ font-size:1.15rem; font-weight:900; color:#f5f5f5; margin-top:6px }
    .analysis-table{ width:100%; border-collapse:collapse; margin-top:8px; background:transparent }
    .analysis-table th, .analysis-table td{ border:1px solid rgba(255,255,255,0.04); padding:6px 8px; text-align:right; font-size:0.95rem; color:#e9ecef }
    .analysis-table th{ background: rgba(255,255,255,0.02); font-weight:800 }
    .analysis-table tbody tr:nth-child(even){ background: rgba(255,255,255,0.01); }
  </style>
  <style>
    /* simple motion graphics and floaters */
    .floater{ position: absolute; border-radius:50%; opacity:0.12; filter: blur(18px); pointer-events:none }
    .floater.f1{ width:220px;height:220px;background:linear-gradient(90deg,var(--accent),var(--accent-2)); top:-40px; right:-60px; transform:rotate(12deg); }
    .floater.f2{ width:160px;height:160px;background:linear-gradient(90deg,#3a7bd5,#00d2ff); bottom:-60px; left:-40px; }
    @keyframes floaty { 0%{ transform: translateY(0) }50%{ transform: translateY(-8px) }100%{ transform: translateY(0) } }
    .floater{ animation: floaty 6s ease-in-out infinite; }
    button{ transition: transform .18s ease, box-shadow .18s ease; }
    button:hover{ transform: translateY(-4px) scale(1.02); }
  </style>

  <!-- PRINT FIXES: force exact color output, remove shadows, thicker borders, show only invoice section -->
  <style>
    @media print {
      /* force printers to render colors and backgrounds as specified */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

      /* ensure page background and text are high-contrast */
      body { background: #fff !important; color: #000 !important; }

      /* only show the invoice print section to avoid page chrome */
      body > * { visibility: hidden !important; }
      #invoicePrintSection, #invoicePrintSection * { visibility: visible !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

      /* layout and sizing */
      #invoicePrintSection { position: static !important; display: block !important; width: auto !important; margin: 0 !important; padding: 0 !important; }

      /* Make table visuals very strong and black */
      #invoicePrintSection table {
        border-collapse: collapse !important;
        width: 100% !important;
        background: #fff !important;
      }
      #invoicePrintSection th, #invoicePrintSection td {
        border: 3px solid #000 !important;         /* thicker black borders */
        padding: 8px 10px !important;
        background: #fff !important;
        color: #000 !important;
        font-weight: 700 !important;              /* bold text */
        font-size: 12pt !important;               /* ensure readable size */
        opacity: 1 !important;                    /* remove any transparency */
        filter: none !important;
        -webkit-filter: none !important;
        box-shadow: none !important;
        text-shadow: none !important;
        -webkit-font-smoothing: none !important;
      }

      /* headings and text */
      #invoicePrintSection h2, #invoicePrintSection h1, #invoicePrintSection p, #invoicePrintSection div { color: #000 !important; background: #fff !important; font-weight:700 !important; }

      /* remove visual effects that might render faint */
      * { box-shadow: none !important; text-shadow: none !important; filter: none !important; opacity: 1 !important; }

      /* page margins */
      @page { size: auto; margin: 10mm; }
    }
  </style>
  <link href="print.css" rel="stylesheet" media="print">
</head>
<body>
  <h2>📦 إدارة طلبات بيست سويت</h2>
  <!-- Floating summary icon (top-left) -->
  <button id="summaryFloatBtn" title="تحليلات الانتاج" aria-label="تحليلات الانتاج" style="display:none">
    📈
    <span class="label">تحليلات الانتاج</span>
  </button>
  <div id="floatingActionsGroup" class="floating-actions-group" aria-label="أدوات الطلب">
    <button id="actionsGroupToggle" class="main-group-btn" type="button" title="فتح أدوات الطلب">⚙️</button>
    <div id="groupMenu" class="group-menu" aria-hidden="true">
      <button id="loadTableBtn" type="button" title="عرض">⬇️</button>
      <button id="copyRequestedToSentBtn" type="button" title="نسخ المطلوب إلى المرسَل">📋</button>
      <button id="addRowBtn" type="button" title="إضافة صنف">➕</button>
      <button id="saveDraftBtnBest" type="button" title="حفظ مؤقت">💾</button>
      <button id="sendQuantitiesBtn" type="button" title="إرسال الكميات">📤</button>
      <button id="toggleAnalysisBtn" type="button" title="عرض / إخفاء تحليل النواقص و الزيادات">📊</button>
      <button id="btnManageInvoices" type="button" onclick="openInvoiceManagement()" title="إدارة الفواتير">🔍</button>
      <button id="issueInvoiceBtn" type="button" title="إصدار فاتورة">🧾</button>
      <button id="openCatalogBtnMobile" type="button" class="mobile-only" aria-label="فتح الكتالوج" title="فتح الكتالوج">📋</button>
      <button id="btnOpenSummary" type="button" style="display:none" title="تحليلات الانتاج">📈</button>
    </div>
  </div>
  <!-- Analysis panel: shortages / excesses (copied from send-to-branches) -->
  <aside class="analysis-panel" id="analysisPanel" aria-hidden="false">
    <h4>تحليل النواقص و الزيادات</h4>
    <div class="analysis-card">
      <div class="title">النواقص</div>
      <div class="value" id="shortageCount">0</div>
      <table class="analysis-table" id="shortageTable">
        <thead><tr><th>الصنف</th><th>الكمية</th></tr></thead>
        <tbody id="shortageList"><tr><td colspan="2" style="text-align:center">لا توجد نواقص</td></tr></tbody>
      </table>
    </div>
    <div class="analysis-card">
      <div class="title">الزيادات</div>
      <div class="value" id="excessCount">0</div>
      <table class="analysis-table" id="excessTable">
        <thead><tr><th>الصنف</th><th>الكمية</th></tr></thead>
        <tbody id="excessList"><tr><td colspan="2" style="text-align:center">لا توجد زيادات</td></tr></tbody>
      </table>
    </div>
  </aside>
  <form id="manageOrderForm">
    <div class="form-row">
      <div class="form-group">
        <label for="branch">🏬 اختر الفرع</label>
        <select id="branch" name="branch" required>
          <option value="">-- اختر الفرع --</option>
          <!-- use values that match Firestore document data -->
          <option value="best_sweet_1">فرع أول جمال</option>
          <option value="best_sweet_abbassia">فرع العباسية</option>
          <option value="best_sweet_helw_zaytoun">فرع حلو منه فيه الزيتون</option>
          <option value="best_sweet_market_zaytoun">فرع الزيتون ماركت</option>
          <option value="best_sweet_helwan">فرع حلوان</option>
        </select>
      </div>
      <div class="form-group">
        <label for="orderDate">📅 تاريخ الطلبية</label>
        <input type="date" id="orderDate" name="orderDate" required>
      </div>
      <div class="form-group">
        <label for="section">📂 اختر القسم</label>
        <div class="section-row">
          <select id="section" name="section" required>
            <option value="">-- اختر القسم --</option>
            <option value="all">كل الأقسام</option>
          </select>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table id="orderDataTable" border="1">
       <thead>
         <tr>
           <th>الكود</th>
           <th>المنتج</th>
           <th>الكمية المطلوبة</th>
            <th>الكمية المرسلة</th>
            <th>الفارق (مرسلة - مطلوبة)</th>
         </tr>
       </thead>
       <tbody>
         <!-- سيتم ملء البيانات هنا ديناميكياً -->
       </tbody>
      </table>
    </div>
   </form>

  <!-- نافذة اختيار القسم -->
  <div id="sectionModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 1000; padding: 20px;">
    <h3>📋 اختيار قسم</h3>
    <select id="sectionSelect" style="width: 100%; padding: 10px; margin-bottom: 20px;">
      <option value="">-- اختر القسم --</option>
    </select>
    <button onclick="loadSectionItems()">عرض الأصناف</button>
    <button onclick="closeSectionModal()">❌ إغلاق</button>
  </div>

  <!-- نافذة اختيار الصنف -->

async function fetchLastInvoiceNumber(){
  if(!db) return;
  try{
    // اجلب كل الأرقام ثم حدد أول رقم موجب غير موجود (fill gap)
    const snap = await db.collection('invoices').get();
    const nums = [];
    snap.forEach(d => {
      const val = d.data().invoiceNumber;
      const n = Number(val);
      if(Number.isInteger(n) && n > 0) nums.push(n);
    });
    if(nums.length === 0){
      nextInvoiceNumber = 1;
      return;
    }
    const setNums = new Set(nums);
    let candidate = 1;
    while(setNums.has(candidate)) candidate++;
    nextInvoiceNumber = candidate;
  }catch(e){ console.warn('fetchLastInvoiceNumber',e); }
}

// عرض الطلبية (تجميع حسب الكود) عند الضغط على زر "عرض"
async function loadOrderData(){
  if(!allowLoadTable) return;
  const branch = branchSelect.value, orderDate = orderDateInput.value, section = sectionSelect.value;
  if(!db || !branch || !orderDate || !section){ Swal.fire('تنبيه','اختر الفرع والتاريخ والقسم ثم اضغط عرض','warning'); return; }
  orderDataBody.innerHTML = '<tr><td colspan="5">⏳ جارٍ التحميل...</td></tr>';
    try{
    let query = db.collection('orders_best_sweet')
      .where('branch','==',branch)
      .where('orderDate','==',orderDate);
    if(section !== 'all'){
      query = query.where('sheet','==',section);
    }
    const snap = await query.get();

    const sectionGroups = new Map();
    snap.forEach(doc=>{
      const o = doc.data(); if(!o) return;
      const code = o.code || '';
      const name = o.name || '';
      const qty = Number(o.qty)||0;
      const sheetName = o.sheet || 'غير محدد';
      if(!code && !name) return;
      if(!sectionGroups.has(sheetName)){
        sectionGroups.set(sheetName, new Map());
      }
      const groupMap = sectionGroups.get(sheetName);
      const key = code || name;
      if(groupMap.has(key)){
        groupMap.get(key).qty += qty;
      } else {
        groupMap.set(key,{ code, name, qty, idx: groupMap.size });
      }
    });

    orderDataBody.innerHTML = '';
    if(sectionGroups.size===0){ orderDataBody.innerHTML = '<tr><td colspan="5">لا توجد بيانات</td></tr>'; return; }

    function leadingSeqCode(s){
      if (!s) return NaN;
      const m = String(s).trim().match(/^(\d+)\s*-/);
      return m ? parseInt(m[1], 10) : NaN;
    }

    const groupKeys = Array.from(sectionGroups.keys());
    groupKeys.forEach(sheetName => {
      const groupMap = sectionGroups.get(sheetName);
      const entries = Array.from(groupMap.values());
      const withIdx = entries.map((e, idx) => ({ ...e, idx }));
      withIdx.sort((a,b) => {
        const seqA = leadingSeqCode(a.code);
        const seqB = leadingSeqCode(b.code);
        const aHas = !isNaN(seqA);
        const bHas = !isNaN(seqB);
        if (aHas && bHas) return seqA - seqB;
        if (aHas && !bHas) return -1;
        if (!aHas && bHas) return 1;
        return (a.idx || 0) - (b.idx || 0);
      });

      if(section === 'all' || sectionGroups.size > 1){
        const headerRow = document.createElement('tr');
        headerRow.className = 'section-header-row';
        headerRow.innerHTML = `<td colspan="5">📁 ${escapeHtml(sheetName)}</td>`;
        orderDataBody.appendChild(headerRow);
      }

      withIdx.forEach(v=>{
        const tr = document.createElement('tr');
        tr.dataset.sheet = sheetName;
        tr.innerHTML = `<td>${escapeHtml(v.code)}</td>` +
                       `<td>${escapeHtml(v.name)}</td>` +
                       `<td>${v.qty}</td>` +
                       `<td><input type="number" value="0" min="0" class="sent-qty"></td>` +
                       `<td class="diff-cell">0</td>`;
        orderDataBody.appendChild(tr);
        const sentInput = tr.querySelector('.sent-qty');
        if(sentInput){ sentInput.addEventListener('input', ()=>{ updateRowDiff(tr); updateAnalysisCards(); }); updateRowDiff(tr); }
      });

      if (section === 'all') {
        const footerRow = document.createElement('tr');
        footerRow.className = 'section-footer-row';
        footerRow.innerHTML = `<td colspan="5"><button type="button" class="section-add-item-btn">＋ إضافة صنف جديد</button></td>`;
        orderDataBody.appendChild(footerRow);
        footerRow.querySelector('.section-add-item-btn')?.addEventListener('click', () => addBlankRowForSection(sheetName, footerRow));
      }
    });
    try{ await loadDraftBest(branch, orderDate, section); }catch(e){ console.warn('loadDraftBest',e); }
    updateAnalysisCards();
  }catch(e){ console.error('loadOrderData',e); Swal.fire('خطأ','فشل تحميل البيانات','error'); }
}

// إرسال الكميات => حفظ/تعديل فاتورة في مجموعة invoices
async function sendQuantities(){
  if(!db){ Swal.fire('خطأ','قاعدة البيانات غير متاحة','error'); return; }
  const branch = branchSelect.value, orderDate = orderDateInput.value, section = sectionSelect.value;
  if(!branch || !orderDate || !section){ Swal.fire('خطأ','اختر الفرع والتاريخ والقسم','error'); return; }
  const rows = Array.from(orderDataBody.querySelectorAll('tr'));
  if(rows.length===0){ Swal.fire('تنبيه','لا توجد أصناف','warning'); return; }
  const products = rows.map(row=>{
    const cells = row.querySelectorAll('td');
    const read = idx => {
      const c = cells[idx];
      if(!c) return '';
      const f = c.querySelector('input,select,textarea');
      return f ? f.value.trim() : c.textContent.trim();
    };
    const code = read(0), name = read(1);
    const requestedQuantity = Number(read(2)||0) || 0;
    const sentQuantity = Number(read(3) ? row.querySelector('.sent-qty')?.value || 0 : 0) || 0;
    return { code, name, requestedQuantity, sentQuantity };
  }).filter(p=>p.code||p.name);
  if(products.length===0){ Swal.fire('تنبيه','لا توجد بيانات صالحة','warning'); return; }

  // compute shortages/excesses and attach to invoice document
  const shortages = [];
  const excesses = [];
  products.forEach(p => {
    const diff = (Number(p.sentQuantity)||0) - (Number(p.requestedQuantity)||0);
    if(diff < 0) shortages.push({ code: p.code, name: p.name, qty: Math.abs(diff) });
    else if(diff > 0) excesses.push({ code: p.code, name: p.name, qty: diff });
  });
  const invoice = { branch, orderDate, section, products, shortages, excesses, createdAt: new Date().toISOString() };
  const docId = `${branch}_${orderDate}_${section}`;
  const ref = db.collection('invoices').doc(docId);

  try{
    const snap = await ref.get();
    let savedInvoice = null;

    if(snap.exists){
      const res = await Swal.fire({ title:'تنبيه', text:'تم العثور على فاتورة بنفس المعطيات. اختر:', icon:'warning', showDenyButton:true, showCancelButton:true, confirmButtonText:'تعديل', denyButtonText:'حفظ جديد', cancelButtonText:'إلغاء' });
      if(res.isConfirmed){
        const existing = snap.data()||{};
        const toUpdate = Object.assign({}, invoice, { invoiceNumber: existing.invoiceNumber || nextInvoiceNumber });
        await ref.update(toUpdate);
        savedInvoice = Object.assign({}, toUpdate);
        Swal.fire('تم التعديل','تم تعديل الفاتورة','success');
        // بعد التعديل أعِد حساب الأرقام المتاحة
        await fetchLastInvoiceNumber();
      } else if(res.isDenied){
        const toSave = Object.assign({}, invoice, { invoiceNumber: nextInvoiceNumber });
        const docRef = await db.collection('invoices').add(toSave);
        savedInvoice = Object.assign({}, toSave, { id: docRef.id });
        Swal.fire('تم الحفظ','حفظ كفاتورة جديدة','success');
        // بعد الإضافة أعِد حساب الأرقام المتاحة (سيملأ أي فراغات لاحقاً)
        await fetchLastInvoiceNumber();
      } else { return; }
    } else {
      const toSave = Object.assign({}, invoice, { invoiceNumber: nextInvoiceNumber });
      await ref.set(toSave);
      savedInvoice = Object.assign({}, toSave);
      Swal.fire('تم','تم إنشاء الفاتورة رقم '+nextInvoiceNumber,'success');
      // بعد الإنشاء أعِد حساب الأرقام المتاحة
      await fetchLastInvoiceNumber();
    }

    // بعد الحفظ/التعديل: اعرض سوِيت ألارِت مع زر طباعة
    if(savedInvoice){
      const printConfirm = await Swal.fire({
        title: 'طباعة الفاتورة',
        text: 'هل تريد طباعة الفاتورة الآن؟',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'طباعة',
        cancelButtonText: 'لاحقاً'
      });
      if(printConfirm.isConfirmed){
        printInvoice(savedInvoice);
      }
    }

  }catch(e){ console.error('sendQuantities',e); Swal.fire('خطأ','حدث خطأ أثناء حفظ الفاتورة','error'); }
}

// save/load helpers for best-sweet page (Firestore-backed drafts)
function _buildDraftDocIdBest(branch, orderDate, section){
  return `draft_best_${branch}_${orderDate}_${section}`.replace(/[^a-zA-Z0-9_\-]/g,'_');
}

async function saveDraftBest(){
  const branch = branchSelect ? branchSelect.value : '';
  const orderDate = orderDateInput ? orderDateInput.value : '';
  const section = sectionSelect ? sectionSelect.value : '';
  if(!branch || !orderDate || !section){ showToast('اختر الفرع والتاريخ والقسم ثم اضغط حفظ مؤقت','warning',3000); return; }

  const rows = Array.from(orderDataBody.querySelectorAll('tr'));
  const products = rows.map(row => {
    const code = row.querySelector('.item-code') ? row.querySelector('.item-code').value.trim() : (row.cells[0]?row.cells[0].textContent.trim(): '');
    const name = row.querySelector('.item-name') ? row.querySelector('.item-name').value.trim() : (row.cells[1]?row.cells[1].textContent.trim(): '');
    const requested = row.querySelector('.requested-qty') ? Number(row.querySelector('.requested-qty').value || 0) : Number((row.cells[2]?row.cells[2].textContent:0)) || 0;
    const sentEl = row.querySelector('.sent-qty') ? row.querySelector('.sent-qty') : (row.cells[3]? row.cells[3].querySelector('input') : null);
    const sent = sentEl ? Number(sentEl.value || 0) : 0;
    return { code, name, requested, sent, sheet: row.dataset.sheet || section };
  }).filter(p => p.code || p.name);

  const docId = _buildDraftDocIdBest(branch, orderDate, section);
  try {
    await db.collection('drafts').doc(docId).set({ branch, orderDate, section, products, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    showToast('تم حفظ المسودة بنجاح','success',3000);
  } catch (e) {
    console.error('saveDraftBest', e);
    showToast('فشل حفظ المسودة، حاول مرة أخرى','error',3000);
  }
}

async function loadDraftBest(branch, orderDate, section){
  const b = branch || (branchSelect ? branchSelect.value : '');
  const od = orderDate || (orderDateInput ? orderDateInput.value : '');
  const s = section || (sectionSelect ? sectionSelect.value : '');
  if(!b || !od || !s) return;
  try{
    let products = [];
    if (s === 'all') {
      const snapshot = await db.collection('drafts')
        .where('branch', '==', b)
        .where('orderDate', '==', od)
        .get();
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data && Array.isArray(data.products)) {
          products = products.concat(data.products);
        }
      });
    } else {
      const docId = _buildDraftDocIdBest(b, od, s);
      const snap = await db.collection('drafts').doc(docId).get();
      if (snap.exists) {
        const data = snap.data();
        if (data && Array.isArray(data.products)) {
          products = products.concat(data.products);
        }
      }
      const allDocId = _buildDraftDocIdBest(b, od, 'all');
      const allSnap = await db.collection('drafts').doc(allDocId).get();
      if (allSnap.exists) {
        const allData = allSnap.data();
        if (allData && Array.isArray(allData.products)) {
          products = products.concat(allData.products.filter(p => {
            const sheet = (p.sheet||'').toString().trim().toLowerCase();
            return sheet === s;
          }));
        }
      }
    }
    if(!Array.isArray(products) || products.length===0) return;
    const rows = Array.from(orderDataBody.querySelectorAll('tr'));
    const map = new Map();
    products.forEach(p=>{
      const code = (p.code||'').toString().trim().toLowerCase();
      const name = (p.name||'').toString().trim().toLowerCase();
      const sheet = (p.sheet||'').toString().trim().toLowerCase();
      if(code||name){
        const key = `${sheet}|${code}`;
        const alt = `${sheet}|${name}`;
        if(!map.has(key) && key !== '|') map.set(key,p);
        if(!map.has(alt) && alt !== '|') map.set(alt,p);
        if(!map.has(code) && code) map.set(code,p);
        if(!map.has(name) && name) map.set(name,p);
      }
    });
    let restored = false;
    rows.forEach(row=>{
      const code = row.querySelector('.item-code') ? row.querySelector('.item-code').value.trim() : (row.cells[0]?row.cells[0].textContent.trim(): '');
      const name = row.querySelector('.item-name') ? row.querySelector('.item-name').value.trim() : (row.cells[1]?row.cells[1].textContent.trim():'');
      const sheet = (row.dataset.sheet||'').toString().trim().toLowerCase();
      const k1 = `${sheet}|${code.toLowerCase()}`;
      const k2 = `${sheet}|${name.toLowerCase()}`;
      const found = map.get(k1) || map.get(k2) || map.get(code.toLowerCase()) || map.get(name.toLowerCase());
      if(found){
        const sentEl = row.querySelector('.sent-qty') ? row.querySelector('.sent-qty') : (row.cells[3]? row.cells[3].querySelector('input') : null);
        if(sentEl){ sentEl.value = found.sent || 0; restored = true; }
        updateRowDiff(row);
      }
    });
    if(restored){ showToast(s === 'all' ? 'تم استرجاع المسودات لجميع الأقسام' : 'تم استرجاع المسودة لهذا القسم', 'success', 2800); updateAnalysisCards(); }
  }catch(e){ console.error('loadDraftBest',e); }
}

// --- Diff & Analysis helpers (for the left analysis panel) ---
function getRequestedFromRow_bs(row){
  const rqInput = row.querySelector('.requested-qty');
  if(rqInput) return Number(rqInput.value || 0);
  const txt = row.cells && row.cells[2] ? row.cells[2].textContent : '0';
  return Number(txt || 0);
}
function getSentFromRow_bs(row){
  const s = row.querySelector('.sent-qty');
  if(s) return Number(s.value || 0);
  const txt = row.cells && row.cells[3] ? (row.cells[3].querySelector('input') ? row.cells[3].querySelector('input').value : row.cells[3].textContent) : '0';
  return Number(txt || 0);
}

function updateRowDiff(row){
  try{
    const requested = getRequestedFromRow_bs(row);
    const sent = getSentFromRow_bs(row);
    const diff = (Number(sent) || 0) - (Number(requested) || 0);
    const cell = row.querySelector('.diff-cell') || row.insertCell(4);
    cell.textContent = diff;
    if(diff < 0){ cell.classList.add('negative'); } else { cell.classList.remove('negative'); }
  }catch(e){ console.warn('updateRowDiff', e); }
}

function updateAnalysisCards(){
  try{
    const rows = Array.from(orderDataBody.querySelectorAll('tr'));
    const shortages = [];
    const excesses = [];
    rows.forEach(row=>{
      const requested = getRequestedFromRow_bs(row);
      const sent = getSentFromRow_bs(row);
      const diff = (Number(sent)||0) - (Number(requested)||0);
      const name = (row.querySelector('.item-name') ? row.querySelector('.item-name').value : (row.cells[1]?row.cells[1].textContent:'')).trim();
      if(!name) return;
      if(diff < 0) shortages.push({ name, qty: Math.abs(diff) });
      else if(diff > 0) excesses.push({ name, qty: diff });
    });

    const sList = document.getElementById('shortageList');
    const eList = document.getElementById('excessList');
    const sCount = document.getElementById('shortageCount');
    const eCount = document.getElementById('excessCount');
    if(sList){
      sList.innerHTML = '';
      if(shortages.length===0) sList.innerHTML = '<tr><td colspan="2" style="text-align:center">لا توجد نواقص</td></tr>';
      else shortages.forEach(it=>{ const tr = document.createElement('tr'); const td1 = document.createElement('td'); const td2 = document.createElement('td'); td1.textContent = it.name; td2.textContent = it.qty; tr.appendChild(td1); tr.appendChild(td2); sList.appendChild(tr); });
    }
    if(eList){
      eList.innerHTML = '';
      if(excesses.length===0) eList.innerHTML = '<tr><td colspan="2" style="text-align:center">لا توجد زيادات</td></tr>';
      else excesses.forEach(it=>{ const tr = document.createElement('tr'); const td1 = document.createElement('td'); const td2 = document.createElement('td'); td1.textContent = it.name; td2.textContent = it.qty; tr.appendChild(td1); tr.appendChild(td2); eList.appendChild(tr); });
    }
    if(sCount) sCount.textContent = shortages.length;
    if(eCount) eCount.textContent = excesses.length;
  }catch(e){ console.warn('updateAnalysisCards', e); }
}

function copyRequestedToSentValues() {
  const rows = Array.from(orderDataBody.querySelectorAll('tr'));
  let updated = false;
  rows.forEach(row => {
    const requested = getRequestedFromRow_bs(row);
    const sentInput = row.querySelector('.sent-qty');
    if (sentInput && !Number.isNaN(requested)) {
      sentInput.value = requested;
      updateRowDiff(row);
      updated = true;
    }
  });
  if (updated) {
    updateAnalysisCards();
    showToast('تم نسخ الكميات المطلوبة إلى المرسلة', 'success', 2600);
  }
}
  </script>
</body>
</html>
