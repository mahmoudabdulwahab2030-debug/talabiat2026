<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تفاصيل نشاط المستخدم</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <style>
    :root { --bg:#0b0d0e; --card:#151718; --border:rgba(255,255,255,0.08); --text:#eaeaea; --muted:#8a8f94; --accent:#e8b44a; --ok:#3ecf8e; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,Arial,sans-serif; }
    h2 { margin:0 0 4px; color:var(--accent); }
    h3 { margin:24px 0 10px; color:var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    .hdr { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    button { cursor:pointer; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); font-family:inherit; }
    button:hover { border-color:var(--accent); }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-top:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .card .label { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .card .value { font-size:16px; font-weight:700; word-break:break-word; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:700; }
    .badge.on { background:rgba(62,207,142,0.15); color:var(--ok); }
    .badge.off { background:rgba(138,143,148,0.15); color:var(--muted); }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
    th, td { padding:9px 8px; border-bottom:1px solid var(--border); text-align:center; font-size:14px; vertical-align:top; }
    th { background:#0f1112; color:var(--accent); font-weight:800; }
    td.ltr, .ltr { direction:ltr; unicode-bidi:embed; }
    .table-wrap { overflow-x:auto; }
    details { background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; padding:10px 14px; }
    summary { cursor:pointer; font-weight:700; color:var(--text); }
    summary .muted { font-weight:400; margin-inline-start:8px; }
    .details-body { margin-top:10px; }
    .details-text { max-width:360px; word-break:break-word; color:var(--muted); font-size:12px; text-align:right; }
  </style>
</head>
<body>
  <div class="hdr">
    <div>
      <h2 id="udTitle">⏳ جاري التحميل...</h2>
      <div id="udSub" class="muted"></div>
    </div>
    <div>
      <button id="udRefresh">🔄 تحديث</button>
    </div>
  </div>
  <div id="udStatus" class="muted" style="margin-top:10px;"></div>

  <div id="udCards" class="cards"></div>

  <h3>🧭 الصفحات التي زارها</h3>
  <div id="udPages" class="table-wrap"></div>

  <h3>📊 الإجراءات المسجلة</h3>
  <div id="udActions" class="table-wrap"></div>

  <h3>🗂️ الجلسات</h3>
  <div id="udSessions"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5nOr7oPJQydnZTUULmf2YxE33ppYz2Gw",
      authDomain: "ledoux-80b46.firebaseapp.com",
      projectId: "ledoux-80b46",
      storageBucket: "ledoux-80b46.appspot.com",
      messagingSenderId: "1020769543389",
      appId: "1:1020769543389:web:fc083525fd9675d9f86734",
      measurementId: "G-VJTW1W3D8D"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // فجوة زمنية أكبر من هذه المدة تعني بداية جلسة جديدة
    const SESSION_GAP_MS = 30 * 60 * 1000;
    // يُعتبر المستخدم "نشطًا الآن" إذا كان آخر نشاط خلال هذه المدة
    const ONLINE_MS = 5 * 60 * 1000;

    const ROLE_LABELS_SHORT = {};
    const userCode = (new URLSearchParams(location.search).get("user") || "").trim();

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    // تحويل أي صيغة للتاريخ (رقم، نص، Timestamp) إلى مللي ثانية
    function toMs(t) {
      if (!t) return 0;
      if (typeof t === "number") return t;
      if (typeof t === "string") { const n = Date.parse(t); return isNaN(n) ? 0 : n; }
      if (typeof t.toMillis === "function") return t.toMillis();
      if (typeof t.toDate === "function") return t.toDate().getTime();
      if (typeof t.seconds === "number") return t.seconds * 1000;
      return 0;
    }

    function fmtDate(ms) { return ms ? new Date(ms).toLocaleString("ar-EG") : "—"; }

    function fmtDur(ms) {
      if (!ms || ms < 0) return "0 د";
      const totalMin = Math.floor(ms / 60000);
      const h = Math.floor(totalMin / 60), m = totalMin % 60;
      return h ? `${h} س ${m} د` : `${m} د`;
    }

    function fmtAgo(ms) {
      if (!ms) return "";
      const d = Date.now() - ms;
      if (d < 60000) return "منذ لحظات";
      const mins = Math.floor(d / 60000);
      if (mins < 60) return `منذ ${mins} د`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `منذ ${hrs} س`;
      return `منذ ${Math.floor(hrs / 24)} يوم`;
    }

    function fmtDetails(d) {
      if (!d) return "";
      let txt = typeof d === "string" ? d : (d.title ? d.title : JSON.stringify(d));
      if (txt.length > 200) txt = txt.slice(0, 200) + "…";
      return txt;
    }

    function setStatus(msg) { document.getElementById("udStatus").textContent = msg; }

    function buildSessions(logs) {
      const sessions = [];
      let cur = null;
      logs.forEach(l => {
        if (!l._ms) return;
        if (!cur || l._ms - cur.end > SESSION_GAP_MS) {
          cur = { start: l._ms, end: l._ms, items: [] };
          sessions.push(cur);
        }
        cur.end = l._ms;
        cur.items.push(l);
      });
      return sessions;
    }

    function render(user, logs) {
      const title = document.getElementById("udTitle");
      const sub = document.getElementById("udSub");
      const name = (user && user.name) || userCode;
      title.textContent = `👤 ${name}`;
      sub.textContent = `كود المستخدم: ${userCode}`;
      document.title = `نشاط ${name}`;

      const roles = (user && user.roles) || [];
      const trialMs = user ? toMs(user.trialExpiresAt) : 0;
      const trialTxt = !trialMs ? "غير محددة" : (trialMs - Date.now() <= 0 ? "منتهية" : `تنتهي ${fmtDate(trialMs)}`);

      const sessions = buildSessions(logs);
      const last = logs.length ? logs[logs.length - 1] : null;
      const online = last && (Date.now() - last._ms) < ONLINE_MS;
      const pageViews = logs.filter(l => l.action === "page_view");
      const avgSession = sessions.length
        ? sessions.reduce((s, x) => s + (x.end - x.start), 0) / sessions.length
        : 0;
      const first = logs.length ? logs[0]._ms : 0;

      // بطاقات الحالة العامة
      document.getElementById("udCards").innerHTML = `
        <div class="card"><div class="label">حالة النشاط</div><div class="value">
          ${online ? '<span class="badge on">🟢 نشط الآن</span>' : '<span class="badge off">⚪ غير نشط</span>'}
        </div></div>
        <div class="card"><div class="label">آخر نشاط</div><div class="value">${esc(fmtDate(last && last._ms))}</div>
          <div class="muted">${esc(last ? fmtAgo(last._ms) : "")}</div></div>
        <div class="card"><div class="label">آخر صفحة</div><div class="value ltr">${esc(last ? (last.page || "—") : "—")}</div></div>
        <div class="card"><div class="label">عدد الجلسات</div><div class="value">${sessions.length}</div></div>
        <div class="card"><div class="label">إجمالي الزيارات</div><div class="value">${pageViews.length}</div></div>
        <div class="card"><div class="label">إجمالي الأحداث</div><div class="value">${logs.length}</div></div>
        <div class="card"><div class="label">متوسط مدة الجلسة</div><div class="value">${esc(fmtDur(avgSession))}</div></div>
        <div class="card"><div class="label">أول نشاط مسجل</div><div class="value">${esc(fmtDate(first))}</div></div>
        <div class="card"><div class="label">عدد الصلاحيات</div><div class="value">${roles.length}</div></div>
        <div class="card"><div class="label">فترة التجربة</div><div class="value">${esc(trialTxt)}</div></div>
      `;

      // الصفحات التي زارها
      const pageStats = {};
      pageViews.forEach(l => {
        const p = l.page || "—";
        if (!pageStats[p]) pageStats[p] = { count: 0, last: 0 };
        pageStats[p].count++;
        pageStats[p].last = Math.max(pageStats[p].last, l._ms);
      });
      const pageRows = Object.entries(pageStats).sort((a, b) => b[1].count - a[1].count);
      document.getElementById("udPages").innerHTML = pageRows.length
        ? `<table><thead><tr><th>الصفحة</th><th>عدد الزيارات</th><th>آخر زيارة</th></tr></thead><tbody>
            ${pageRows.map(([p, s]) => `<tr><td class="ltr">${esc(p)}</td><td>${s.count}</td><td>${esc(fmtDate(s.last))}</td></tr>`).join("")}
           </tbody></table>`
        : `<div class="muted">لا توجد زيارات مسجلة</div>`;

      // الإجراءات
      const actStats = {};
      logs.forEach(l => { const a = l.action || "—"; actStats[a] = (actStats[a] || 0) + 1; });
      const actRows = Object.entries(actStats).sort((a, b) => b[1] - a[1]);
      document.getElementById("udActions").innerHTML = actRows.length
        ? `<table><thead><tr><th>الإجراء</th><th>عدد المرات</th></tr></thead><tbody>
            ${actRows.map(([a, c]) => `<tr><td class="ltr">${esc(a)}</td><td>${c}</td></tr>`).join("")}
           </tbody></table>`
        : `<div class="muted">لا توجد إجراءات مسجلة</div>`;

      // الجلسات (الأحدث أولاً، والأحدث مفتوح تلقائياً)
      const sessEl = document.getElementById("udSessions");
      if (!sessions.length) {
        sessEl.innerHTML = `<div class="muted">لا توجد جلسات مسجلة لهذا المستخدم</div>`;
        return;
      }
      const ordered = sessions.slice().reverse();
      sessEl.innerHTML = ordered.map((s, idx) => {
        const views = s.items.filter(i => i.action === "page_view").length;
        const number = sessions.length - idx;
        const rows = s.items.slice().reverse().map(i => `
          <tr>
            <td>${esc(fmtDate(i._ms))}</td>
            <td class="ltr">${esc(i.page || "—")}</td>
            <td class="ltr">${esc(i.action || "—")}</td>
            <td><div class="details-text">${esc(fmtDetails(i.details))}</div></td>
          </tr>`).join("");
        return `
          <details ${idx === 0 ? "open" : ""}>
            <summary>
              الجلسة ${number}
              <span class="muted">${esc(fmtDate(s.start))} ← ${esc(fmtDate(s.end))} · المدة ${esc(fmtDur(s.end - s.start))} · ${views} زيارة · ${s.items.length} حدث</span>
            </summary>
            <div class="details-body table-wrap">
              <table>
                <thead><tr><th>الوقت</th><th>الصفحة</th><th>الإجراء</th><th>التفاصيل</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </details>`;
      }).join("");
    }

    async function load() {
      if (!userCode) {
        document.getElementById("udTitle").textContent = "لم يتم تحديد المستخدم";
        setStatus("افتح هذه الصفحة من لوحة الإدارة عبر زر «عرض النشاط».");
        return;
      }
      setStatus("⏳ جاري جلب البيانات...");
      try {
        const [userDoc, logsSnap] = await Promise.all([
          db.collection("users").doc(userCode).get(),
          db.collection("activity_logs")
            .where("user", "==", userCode)
            .orderBy("timestamp", "desc")
            .limit(1000)
            .get()
        ]);
        const user = userDoc.exists ? (userDoc.data() || {}) : null;
        const logs = [];
        logsSnap.forEach(d => {
          const x = d.data() || {};
          logs.push({ ...x, _ms: toMs(x.timestamp) });
        });
        logs.sort((a, b) => a._ms - b._ms);
        render(user, logs);
        setStatus(`✅ تم تحميل ${logs.length} سجل`);
      } catch (e) {
        console.error(e);
        setStatus("❌ فشل جلب البيانات. تأكد من الاتصال، ومن أن مجموعة activity_logs متاحة.");
      }
    }

    document.getElementById("udRefresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
