<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; text-align: center; padding: 100px 20px; background: #1b1b1b; color: white; }
    input, button { padding: 10px; margin: 10px; border-radius: 5px; }
    button { background-color: #8B0000; color: #FFD700; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🔐 تسجيل الدخول</h2>
  <input type="text" id="username" placeholder="اسم المستخدم" /><br />
  <input type="password" id="password" placeholder="كلمة المرور" /><br />
  <button onclick="login()">دخول</button>

  <script>
const firebaseConfig = {
  apiKey: "AIzaSyA5nOr7oPJQydnZTUULmf2YxE33ppYz2Gw",
  authDomain: "ledoux-80b46.firebaseapp.com",
  projectId: "ledoux-80b46",
  storageBucket: "ledoux-80b46.appspot.com",
  messagingSenderId: "1020769543389",
  appId: "1:1020769543389:web:fc083525fd9675d9f86734",
  measurementId: "G-VJTW1W3D8D"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const userRef = db.collection("users").doc(username);
      const userSnap = await userRef.get();

      if (!userSnap.exists) {
        alert("❌ اسم المستخدم غير موجود");
        return;
      }

      const data = userSnap.data();
      if (data.password !== password) {
        alert("❌ كلمة المرور غير صحيحة");
        return;
      }

      const roles = data.roles.join(",");
      window.location.href = `main.html?roles=${encodeURIComponent(roles)}`;
    }
  </script>
</body>
</html>
