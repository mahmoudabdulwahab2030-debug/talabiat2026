<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة صنف جديد - مخازن غذائية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <script src="include-navbar.js"></script>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">نموذج تسجيل صنف جديد (مخازن غذائية)</h5>
          </div>
          <div class="card-body">
            <form id="addProductForm">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">اسم الصنف</label>
                  <input id="productName" name="name" type="text" class="form-control" placeholder="مثال: أرز بسمتي" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">باركود الصنف</label>
                  <input id="productBarcode" name="barcode" type="text" class="form-control" placeholder="Barcode">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">القسم</label>
                  <select id="productSection" name="section" class="form-select section-select">
                    <option value="">جارٍ التحميل الأقسام...</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">وحدة القياس</label>
                  <select id="productUnit" name="unit" class="form-select">
                    <option>كجم</option>
                    <option>جم</option>
                    <option>كرتونة</option>
                    <option>قطعة</option>
                    <option>شكارة</option>
                    <option>جالون</option>
                    <option>بولة</option>
                    <option>عدد</option>
                  </select>
                </div>
              </div>

              <div id="unitWeightGroup" class="row mb-3" style="display:none;">
                <div class="col-md-6">
                  <label class="form-label">وزن الوحدة (كجم)</label>
                  <input id="productUnitWeight" type="number" step="0.001" class="form-control" placeholder="مثلاً 1.000">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-4">
                  <label class="form-label">سعر البيع</label>
                  <input id="productSalePrice" name="salePrice" type="number" step="0.01" class="form-control" placeholder="0.00">
                </div>
                <div class="col-md-4">
                  <label class="form-label">حد الطلب (الحد الأدنى)</label>
                  <input id="productReorder" name="reorderLevel" type="number" class="form-control" placeholder="تنبيه عند وصول الكمية لـ">
                </div>
                <div class="col-md-4">
                  <label class="form-label">مكان التخزين</label>
                  <input id="productLocation" name="location" type="text" class="form-control" placeholder="رقم الرف أو الممر">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">وصف إضافي</label>
                <textarea id="productDescription" name="description" class="form-control" rows="3"></textarea>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <button type="button" onclick="document.getElementById('addProductForm').reset()" class="btn btn-secondary">إلغاء</button>
                <button type="submit" class="btn btn-success px-4">حفظ الصنف</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
  <script src="مخازن/sections.js"></script>
  <script src="مخازن/product-add.js"></script>
</body>
</html>
