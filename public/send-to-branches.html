<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إدارة الطلبات</title>
  <link href="style.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Cairo:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --bg-1: #0f1012;
      --bg-2: #17181b;
      --panel: #1a1b1e;
      --accent: #ff3b55;
      --accent-2: #ffb300;
      --muted: #9aa0a6;
      --glass: rgba(255,42,77,0.06);
      --surface-contrast: rgba(255,255,255,0.04);
      --shadow: 0 6px 30px rgba(0,0,0,0.6);
      --max-width: 1400px;
    }
    /* ثيم دارك احترافي */
    body {
      background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-1) 100%);
      color: #e9ecef;
      font-family: 'Cairo', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      transition: background 0.5s cubic-bezier(.4,0,.2,1);
    }
    .container {
      background: linear-gradient(180deg,var(--panel), #0e0f10 120%);
      margin: 24px auto;
      padding: 22px;
      border-radius: 16px;
      max-width: var(--max-width);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.7s cubic-bezier(.4,0,.2,1);
      border: 1px solid var(--surface-contrast);
      position: relative;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }
    h2 {
      color: #ff2a4d;
      text-align: center;
      margin-bottom: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #000a;
    }
    .form-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .form-group {
      flex: 1;
      min-width: 200px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #ff2a4d;
      font-weight: bold;
    }
    select, input[type="date"], input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      background: #23232a;
      border: 2px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 0 0 #ff2a4d;
    }
    select:focus, input:focus {
      border-color: #ff2a4d;
      box-shadow: 0 0 8px 2px #ff2a4d88;
      animation: outlinePulse 1.2s infinite;
    }
    @keyframes outlinePulse {
      0% { box-shadow: 0 0 0 0 #ff2a4d88; }
      50% { box-shadow: 0 0 8px 2px #ff2a4d88; }
      100% { box-shadow: 0 0 0 0 #ff2a4d88; }
    }
    .actions-row {
      display: none;
    }
    .floating-actions-group {
      position: fixed;
      top: 72px;
      left: 14px;
      z-index: 1400;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .main-group-btn {
      width: 52px;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.3rem;
      padding: 0;
      background: linear-gradient(90deg, #ff2a4d 40%, #ffb300 100%);
      border: 2px solid #fff;
      color: #121212;
      box-shadow: 0 10px 28px rgba(0,0,0,0.32);
    }
    .group-menu {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(18,18,20,0.95);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
      min-width: 60px;
    }
    .group-menu.open {
      display: flex;
    }
    .group-menu button {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.2rem;
      margin: 0;
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(90deg, #2c2c33 40%, #18181c 100%);
      color: #fff;
    }
    .group-menu button:hover {
      transform: translateY(-1px);
      border-color: #ff2a4d;
      box-shadow: 0 6px 18px rgba(255,59,85,0.18);
    }
    .analysis-panel.hidden {
      display: none !important;
    }
    @media (max-width: 900px) {
      .floating-actions-group {
        top: auto;
        bottom: 14px;
        right: 14px;
      }
    }
    button {
      background: linear-gradient(90deg, #3a3b3c 60%, #23232a 100%);
      color: #fff;
      border: 2px solid #ff2a4d;
      padding: 8px 18px;
      margin: 4px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 2px 8px #0004;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.18s cubic-bezier(.4,0,.2,1), border-color 0.3s;
      outline: none;
      position: relative;
      overflow: hidden;
    }
    button:hover, button:focus {
      background: linear-gradient(90deg, #ff2a4d 60%, #ffb300 100%);
      color: #23232a;
      box-shadow: 0 8px 32px #ff2a4d44, 0 2px 12px #0004;
      transform: translateY(-2px) scale(1.04) rotate(-1deg);
      border-color: #ffb300;
      animation: outlinePulse 1.2s infinite;
    }
    .row-delete-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      border: 1px solid #ff2a4d;
      background: rgba(255, 59, 85, 0.08);
      color: #ff2a4d;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      padding: 0;
    }
    .row-delete-btn:hover,
    .row-delete-btn:focus {
      background: rgba(255, 59, 85, 0.18);
      transform: scale(1.08);
      border-color: #ffb300;
    }
    .delete-cell {
      width: 48px;
    }
    table {
      width: 100%;
      max-width: calc(var(--max-width) - 40px);
      border-collapse: collapse;
      margin: 20px 0;
      background: #23232a;
      border-radius: 16px;
      overflow: auto;
      box-shadow: 0 4px 32px #0008;
      table-layout: auto;
      animation: fadeInTable 0.7s cubic-bezier(.4,0,.2,1);
      border: 1px solid var(--surface-contrast);
    }
    @keyframes fadeInTable {
      from { opacity: 0; transform: scale(0.98);}
      to { opacity: 1; transform: scale(1);}
    }
    th, td {
      border: 1.5px solid #444;
      padding: 14px 12px;
      text-align: center;
      vertical-align: middle;
      white-space: pre-line;
      word-break: break-word;
      font-size: 1.08em;
      transition: background 0.25s, color 0.25s;
      min-width: 120px;
      max-width: 600px;
    }
    th {
      background: linear-gradient(90deg, #444 60%, #23232a 100%);
      color: #ff2a4d;
      font-weight: bold;
      font-size: 1.1em;
      border-bottom: 2.5px solid #ff2a4d;
      letter-spacing: 0.5px;
      transition: background 0.25s, color 0.25s;
      position: relative;
    }
    tr {
      transition: background 0.25s;
    }
    tr:nth-child(even) {
      background: #292929;
    }
    tr:nth-child(odd) {
      background: #23272b;
    }
    tr:hover td {
      background: rgba(255,255,255,0.02);
      color: var(--accent-2);
      transition: background 0.25s, color 0.25s;
      border-color: var(--accent);
      animation: pulseAccent 1.6s infinite;
    }

    .section-header-row td {
      background: rgba(255, 179, 0, 0.18);
      color: #ffd966;
      font-weight: bold;
      text-align: right;
      padding: 12px;
    }
    .section-footer-row td {
      background: rgba(56, 87, 147, 0.12);
      color: #c8d7ff;
      text-align: right;
      padding: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .section-add-item-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(18, 25, 50, 0.95);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .section-add-item-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
      background: rgba(32, 64, 120, 0.98);
    }

    @keyframes pulseAccent { 0%{ box-shadow: 0 0 0 0 rgba(255,59,85,0.08);}50%{ box-shadow: 0 0 20px 6px rgba(255,59,85,0.02);}100%{ box-shadow: 0 0 0 0 rgba(255,59,85,0);} }
    /* نافذة الجدول العائم */
    #floating-table-modal {
      display: none;
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      margin: auto;
      z-index: 9999;
      max-width: 98vw;
      background: #23232a;
      border-radius: 18px;
      box-shadow: 0 8px 40px #000b;
      padding: 24px 12px 18px 12px;
      border: 2px solid #ff2a4d;
      animation: fadeInUp 0.5s cubic-bezier(.4,0,.2,1);
    }
    #close-floating-table {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff2a4d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 18px;
      font-size: 1.1em;
      cursor: pointer;
      z-index: 10001;
      transition: background 0.2s;
    }
    #close-floating-table:hover {
      background: #ffb300;
      color: #23232a;
    }
    /* Responsive for mobile */
    button.mobile-only {
      display: none;
    }
    @media (max-width: 700px) {
      .container {
        padding: 8px;
        margin: 10px auto;
        max-width: 99vw;
      }
      table, th, td {
        font-size: 12px;
      }
      th, td {
        min-width: 60px;
        padding: 8px 4px;
      }
      button {
        width: 100%;
        font-size: 1em;
      }
      table {
        display: block;
        overflow-x: auto;
        width: 100%;
        min-width: 320px;
      }
      #floating-table-modal {
        max-width: 99vw;
        padding: 10px 2px 10px 2px;
        left: 1vw;
        right: 1vw;
      }
      button.mobile-only {
        display: inline-block;
        width: auto;
      }
    }
    @media (max-width: 400px) {
      .container {
        padding: 2px;
      }
      th, td {
        font-size: 10px;
        padding: 4px 2px;
      }
      #floating-table-modal {
        padding: 4px 1px 4px 1px;
      }
    }
    /* أوتلاين متحرك للعناصر التفاعلية */
    input:focus, select:focus, button:focus {
      outline: none;
      border-color: #ff2a4d;
      box-shadow: 0 0 8px 2px #ff2a4d88;
      animation: outlinePulse 1.2s infinite;
    }
    /* difference cell styling */
    .diff-cell {
      font-weight: 800;
      color: #e9ecef;
      background: transparent;
      transition: background 0.24s, color 0.24s;
      text-align: center;
      min-width: 110px;
    }
    .diff-cell.negative {
      background: linear-gradient(90deg, rgba(231,76,60,0.14), rgba(231,76,60,0.06));
      color: #ffdddd;
      border-radius: 6px;
      box-shadow: inset 0 -2px 8px rgba(0,0,0,0.25);
    }

    /* analysis panel (left side) — dark style matching the page */
    .analysis-panel {
      position: fixed;
      left: 12px;
      top: 110px;
      width: 320px;
      max-height: calc(100vh - 160px);
      overflow: auto;
      z-index: 1300;
      background: linear-gradient(180deg, rgba(20,20,22,0.96), rgba(14,14,16,0.98));
      border: 1px solid rgba(255,255,255,0.04);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      font-family: 'Cairo', Arial, sans-serif;
      color: #e9ecef;
      backdrop-filter: blur(4px);
    }
    .analysis-panel h4{ margin:6px 0 10px 0; color: #e9ecef; font-size:1rem }
    .analysis-card{ background: linear-gradient(180deg,#151517,#1b1c1f); border-radius:10px; padding:10px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.03); }
    .analysis-card .title{ font-weight:800; color:#f5f5f5; }
    .analysis-card .value{ font-size:1.15rem; font-weight:900; color:#f5f5f5; margin-top:6px }
    .analysis-table{ width:100%; border-collapse:collapse; margin-top:8px; background:transparent }
    .analysis-table th, .analysis-table td{ border:1px solid rgba(255,255,255,0.04); padding:6px 8px; text-align:right; font-size:0.95rem; color:#e9ecef }
    .analysis-table th{ background: rgba(255,255,255,0.02); font-weight:800 }
    .analysis-table tbody tr:nth-child(even){ background: rgba(255,255,255,0.01); }
  </style>
  <link href="print.css" rel="stylesheet" media="print">
</head>
<body>
  <h2>📦 إدارة الطلبات</h2>
  <!-- Floating summary icon (top-left) -->
  <button id="summaryFloatBtn" title="تحليلات الانتاج" aria-label="تحليلات الانتاج" style="display:none">
    📈
    <span class="label">تحليلات الانتاج</span>
  </button>
  <div id="floatingActionsGroup" class="floating-actions-group" aria-label="أدوات الطلب">
    <button id="actionsGroupToggle" class="main-group-btn" type="button" title="فتح أدوات الطلب">⚙️</button>
    <div id="groupMenu" class="group-menu" aria-hidden="true">
      <button id="loadTableBtn" type="button" title="عرض">⬇️</button>
      <button id="copyRequestedToSentBtn" type="button" title="نسخ المطلوب إلى المرسَل">📋</button>
      <button id="addRowBtn" type="button" title="إضافة صنف">➕</button>
      <button id="saveDraftBtn" type="button" title="حفظ مؤقت">💾</button>
      <button id="sendQuantitiesBtn" type="button" title="إرسال الكميات">📤</button>
      <button id="toggleAnalysisBtn" type="button" title="عرض / إخفاء تحليل النواقص و الزيادات">📊</button>
      <button id="btnManageInvoices" type="button" onclick="openInvoiceManagement()" title="إدارة الفواتير">🔍</button>
      <button id="issueInvoiceBtn" type="button" title="إصدار فاتورة">🧾</button>
      <button id="btnOpenSummary" type="button" style="display:none" title="تحليلات الانتاج">📈</button>
    </div>
  </div>
  <!-- Analysis panel: shortages / excesses -->
  <aside class="analysis-panel" id="analysisPanel" aria-hidden="false">
    <h4>تحليل النواقص و الزيادات</h4>
    <div class="analysis-card">
      <div class="title">النواقص</div>
      <div class="value" id="shortageCount">0</div>
      <table class="analysis-table" id="shortageTable">
        <thead><tr><th>الصنف</th><th>الكمية</th></tr></thead>
        <tbody id="shortageList"><tr><td colspan="2" style="text-align:center">لا توجد نواقص</td></tr></tbody>
      </table>
    </div>
    <div class="analysis-card">
      <div class="title">الزيادات</div>
      <div class="value" id="excessCount">0</div>
      <table class="analysis-table" id="excessTable">
        <thead><tr><th>الصنف</th><th>الكمية</th></tr></thead>
        <tbody id="excessList"><tr><td colspan="2" style="text-align:center">لا توجد زيادات</td></tr></tbody>
      </table>
    </div>
  </aside>
  <form id="manageOrderForm">
    <div class="form-row">
      <div class="form-group">
        <label for="branch">🏬 اختر الفرع</label>
        <select id="branch" name="branch" required>
          <option value="korba">فرع الكوربة</option>
          <option value="dokki">فرع الدقي</option>
          <option value="tagamo3">فرع التجمع</option>
          <option value="obour">فرع العبور</option>
        </select>
      </div>
      <div class="form-group">
        <label for="orderDate">📅 تاريخ الطلبية</label>
        <input type="date" id="orderDate" name="orderDate" required>
      </div>
      <div class="form-group">
        <label for="section">📂 اختر القسم</label>
        <div class="section-row">
          <select id="section" name="section" required>
            <option value="">-- اختر القسم --</option>
            <option value="all">كل الأقسام</option>
          </select>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table id="orderDataTable" border="1">
       <thead>
          <tr>
            <th>الكود</th>
            <th>المنتج</th>
            <th>الكمية المطلوبة</th>
            <th>الكمية المرسلة</th>
            <th>الفارق (مرسلة - مطلوبة)</th>
            <th>حذف</th>
          </tr>
       </thead>
       <tbody>
         <!-- سيتم ملء البيانات هنا ديناميكياً -->
       </tbody>
      </table>
    </div>
    <div class="actions-row">
            <button id="loadTableBtn" type="button" style="margin-left:8px;">⬇️ عرض</button>
      <button id="copyRequestedToSentBtn" type="button">📋 نسخ المطلوب إلى المرسَل</button>
      <button id="addRowBtn" type="button">➕ إضافة صنف</button>
  <button id="saveDraftBtn" type="button">💾 حفظ مؤقت</button>
      <button id="sendQuantitiesBtn" type="button">إرسال الكميات</button>
      <button id="mobileViewBtn" class="mobile-only" type="button">📱 عرض للموبايل</button>
      <button id="btnManageInvoices" type="button" onclick="openInvoiceManagement()">🔍 إدارة الفواتير</button>
      <button id="issueInvoiceBtn" type="button" style="margin-left:8px;">🧾 اصدار فاتورة</button>
      <button id="btnOpenSummary" type="button" style="display:none">📈 تحليلات الانتاج</button>
      <!-- زر مختصر للموبايل لفتح الكتالوج (بديل F1) -->
      <button id="openCatalogBtnMobile" type="button" class="mobile-only" aria-label="فتح الكتالوج">📋</button>
    </div>
   </form>

  <!-- نافذة اختيار القسم -->
  <div id="sectionModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 1000; padding: 20px;">
    <h3>📋 اختيار قسم</h3>
    <select id="sectionSelect" style="width: 100%; padding: 10px; margin-bottom: 20px;">
      <option value="">-- اختر القسم --</option>
    </select>
    <button onclick="loadSectionItems()">عرض الأصناف</button>
    <button onclick="closeSectionModal()">❌ إغلاق</button>
  </div>

  <!-- نافذة اختيار الصنف -->
  <div id="catalogModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; max-width: 800px; height: 60%; background: #2c2c2c; border: 1px solid #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(255,0,0,0.2); z-index: 1000; padding: 20px; overflow-y: auto;">
    <h3 style="text-align: center; color: #ff2a4d;">📋 اختيار صنف</h3>
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: center; color: #fff;">
      <thead>
        <tr style="background-color: #444; color: #fff;">
          <th>كود الصنف</th>
          <th>اسم الصنف</th>
          <th>اختيار</th>
        </tr>
      </thead>
      <tbody id="catalogTableBody">
        <!-- سيتم تحميل البيانات هنا -->
      </tbody>
    </table>
    <button onclick="closeCatalogModal()" style="margin-top: 10px; display: block; margin-left: auto; margin-right: auto; background-color: #ff2a4d; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">❌ إغلاق</button>
  </div>

  <!-- تظليل الخلفية عند فتح النافذة -->
  <div id="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999;"></div>

  <!-- Mobile-friendly compact view modal -->
  <div id="mobileViewModal" style="display:none; position: fixed; top: 8vh; left: 4vw; right: 4vw; max-width: 92vw; z-index: 12000; background: #23232a; border-radius: 12px; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.04);">
    <button id="closeMobileView" style="float:left;background:#ff2a4d;color:#fff;border:none;border-radius:8px;padding:6px 12px;margin-bottom:8px;">إغلاق</button>
    <h3 style="text-align:center;color:#ff2a4d;margin-top:4px">عرض موبايل - ملخص الأصناف</h3>
    <div id="mobileViewContent" style="max-height:60vh;overflow:auto;margin-top:8px;"></div>
  </div>

  <div id="invoicePrintSection" style="display:none;"></div>

  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
  // Floating button styles and tooltip
  (function(){

    async function loadOrderData() {
      // امنع التشغيل إلا إذا فُعل العلم (يفعله زر "عرض")
      if (!allowLoadTable) return;

      const branch = branchSelect.value;
      const orderDate = orderDateInput.value;

      if (!branch || !orderDate || !section) {
        Swal.fire('تنبيه', 'يرجى اختيار الفرع والتاريخ والقسم أولاً ثم اضغط عرض.', 'warning');

      try {

        let query = db.collection('orders')
          .where('branch', '==', branch)
          .where('orderDate', '==', orderDate);

        if (section !== 'all') {
          query = query.where('sheet', '==', section);
        }

        const snapshot = await query.get();
        orderDataTable.innerHTML = '';

        const sectionGroups = new Map();

        snapshot.forEach((doc) => {
            const order = doc.data();
            if (!order.code) return; // Skip orders without a code

            const sheetName = order.sheet || 'غير محدد';
            if (!sectionGroups.has(sheetName)) {
              sectionGroups.set(sheetName, new Map());
            }

            const groupMap = sectionGroups.get(sheetName);
            if (groupMap.has(order.code)) {
                const existing = groupMap.get(order.code);
                existing.qty += (Number(order.qty) || 0);
            } else {
                groupMap.set(order.code, {
                    ...order,
                    qty: (Number(order.qty) || 0),
                    sheet: sheetName
                });
            }
        });

        function leadingSeqCode(s){
          if(!s) return NaN;
          const m = String(s).trim().match(/^(\d+)\s*-/);
          return m ? parseInt(m[1],10) : NaN;
        }

        const groupKeys = Array.from(sectionGroups.keys());
        groupKeys.forEach((sheetName) => {
          const groupMap = sectionGroups.get(sheetName);
          const entries = Array.from(groupMap.values());
          const withIdx = entries.map((e, idx) => ({ ...e, idx }));

          withIdx.sort((a,b) => {
            const seqA = leadingSeqCode(a.code);
            const seqB = leadingSeqCode(b.code);
            const aHas = !isNaN(seqA);
            const bHas = !isNaN(seqB);
            if(aHas && bHas) return seqA - seqB;
            if(aHas && !bHas) return -1;
            if(!aHas && bHas) return 1;
            return (a.idx || 0) - (b.idx || 0);
          });

          if (section === 'all' || sectionGroups.size > 1) {
            const headerRow = document.createElement('tr');
            headerRow.className = 'section-header-row';

            orderDataTable.appendChild(row);
            attachRowDeleteAction(row);
            const sentInput = row.querySelector('.sent-qty');
            if(sentInput){
              sentInput.addEventListener('input', ()=>{ updateRowDiff(row); updateAnalysisCards(); });

  // --- Diff & Analysis helpers ---
  function getRequestedFromRow(row){
    const rqInput = row.querySelector('.requested-qty');
    if(rqInput) return Number(rqInput.value || 0);
    const txt = row.cells && row.cells[2] ? row.cells[2].textContent : '0';
    return Number(txt || 0);
  }
  function getSentFromRow(row){
    const s = row.querySelector('.sent-qty');
    if(s) return Number(s.value || 0);
    const txt = row.cells && row.cells[3] ? (row.cells[3].querySelector('input') ? row.cells[3].querySelector('input').value : row.cells[3].textContent) : '0';
    return Number(txt || 0);
  }

  function updateRowDiff(row){
    try{
      const requested = getRequestedFromRow(row);
      const sent = getSentFromRow(row);
      // difference defined as sent - requested (so negative => shortage)
      let cell = row.querySelector('.diff-cell');
      if (!cell) {
        cell = document.createElement('td');
        cell.className = 'diff-cell';
        row.appendChild(cell);
      }
      const diff = (Number(sent) || 0) - (Number(requested) || 0);
      cell.textContent = diff;
      if(diff < 0){ cell.classList.add('negative'); } else { cell.classList.remove('negative'); }
    }catch(e){ console.warn('updateRowDiff', e); }
  }

  function attachRowDeleteAction(row){
    const button = row.querySelector('.row-delete-btn');
    if (!button) return;
    button.addEventListener('click', () => {
      row.remove();
      updateAnalysisCards();
    });
  }

  function updateAnalysisCards(){
    try{
      const rows = Array.from(orderDataTable.querySelectorAll('tr'));
      const shortages = [];
      const excesses = [];
      rows.forEach(row=>{
        const requested = getRequestedFromRow(row);
        const sent = getSentFromRow(row);
        const diff = (Number(sent)||0) - (Number(requested)||0);
        const name = (row.querySelector('.item-name') ? row.querySelector('.item-name').value : (row.cells[1]?row.cells[1].textContent:'')).trim();
        if(!name) return;
        if(diff < 0) shortages.push({ name, qty: Math.abs(diff) });
        else if(diff > 0) excesses.push({ name, qty: diff });
      });

      const sList = document.getElementById('shortageList');
      const eList = document.getElementById('excessList');
      const sCount = document.getElementById('shortageCount');
      const eCount = document.getElementById('excessCount');
      if(sList){
        sList.innerHTML = '';
        if(shortages.length===0) sList.innerHTML = '<tr><td colspan="2" style="text-align:center">لا توجد نواقص</td></tr>';
        else shortages.forEach(it=>{ const tr = document.createElement('tr'); const td1 = document.createElement('td'); const td2 = document.createElement('td'); td1.textContent = it.name; td2.textContent = it.qty; tr.appendChild(td1); tr.appendChild(td2); sList.appendChild(tr); });
      }
      if(eList){
        eList.innerHTML = '';
        if(excesses.length===0) eList.innerHTML = '<tr><td colspan="2" style="text-align:center">لا توجد زيادات</td></tr>';
        else excesses.forEach(it=>{ const tr = document.createElement('tr'); const td1 = document.createElement('td'); const td2 = document.createElement('td'); td1.textContent = it.name; td2.textContent = it.qty; tr.appendChild(td1); tr.appendChild(td2); eList.appendChild(tr); });
      }
      if(sCount) sCount.textContent = shortages.length;
      if(eCount) eCount.textContent = excesses.length;
    }catch(e){ console.warn('updateAnalysisCards', e); }
  }

    invoiceProducts.forEach(p => {
      const diff = (Number(p.sentQuantity)||0) - (Number(p.requestedQuantity)||0);
      if(diff < 0) shortages.push({ code: p.code, name: p.name, qty: Math.abs(diff) });
      else if(diff > 0) excesses.push({ code: p.code, name: p.name, qty: diff });
    });

    const invoice = {
      branch,
      orderDate,
      section,
      products: invoiceProducts,
      shortages,
      excesses,
      createdAt: new Date().toISOString(),
      invoiceNumber: invoiceCounter // إضافة رقم الفاتورة
    };

    const invoiceRef = db.collection('invoices').doc(`${branch}_${orderDate}_${section}`);

  function selectCatalogItem(code, name, codeInputId, nameInputId) {
    // إذا تم استدعاء مع معرفات حقول - املأ الحقول المحددة
    if (codeInputId && nameInputId) {

        return;
      }
    }

    // وضع الموبايل أو الملء على آخر صف متاح
    const rows = orderDataTable.querySelectorAll('tr');
    const lastRow = rows[rows.length - 1];
    if (lastRow) {
      const codeInput = lastRow.querySelector('.item-code');
      const nameInput = lastRow.querySelector('.item-name');
      if (codeInput && nameInput) {
        codeInput.value = code;
        nameInput.value = name;
        closeCatalogModal();
        return;

      <td><input type="text" id="itemName-${uniqueId}" class="item-name" value="${name}"></td>

    `;
    orderDataTable.appendChild(row);
    attachRowDeleteAction(row);
    // عاود إضافة مستمع F1 للحقل الجديد

  function navigateWithRoles(url) {
     try {
       const stored = localStorage.getItem('roles');
       if (stored) {
         const sep = url.includes('?') ? '&' : '?';
         window.location.href = url + sep + 'roles=' + encodeURIComponent(stored);
         return;
       }
     } catch (e) { /* تجاهل أخطاء التخزين */ }
     window.location.href = url;
   }

   function fetchLastInvoiceNumber() {
     db.collection('invoices')

       .get()
       .then(snapshot => {
         if (!snapshot.empty) {

   // صلاحيات: اقرأها من URL إذا جاءت ثم خزّنها في localStorage، وإلا اقرأ من localStorage
   // دالة مركزية لإعادة التهيئة عند العودة للصفحة (لا حاجة للتحديث اليدوي)
   function getRolesArray() {
    const q = new URLSearchParams(window.location.search).get("roles");
    if (q) {
      try { localStorage.setItem('roles', q); } catch(e) {}
      return q.split(",");
    }
    const stored = localStorage.getItem('roles');
    return stored ? stored.split(",") : [];
  }

   // استبدال دالة sendQuantities بأخرى تتحقق من الوجود وتعرض خيارات تعديل / حفظ جديد / إلغاء
  async function sendQuantities() {
    const branch = document.getElementById('branch').value;
    const orderDate = document.getElementById('orderDate').value;
    const section = document.getElementById('section').value;

    if (!branch || !orderDate || !section) {
      Swal.fire({
        icon: 'error',
        title: 'خطأ',
        text: 'يرجى اختيار الفرع والتاريخ والقسم قبل الإرسال.',
      });
      return;
    }

    const rows = Array.from(orderDataTable.querySelectorAll('tr'));
    if (rows.length === 0) {
      Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'لا توجد أصناف لإرسالها.' });
      return;
    }

    const products = rows.map(row => {
      const cells = row.querySelectorAll('td');
      const readCell = (idx) => {
        const cell = cells[idx];
        if (!cell) return '';
        const field = cell.querySelector('input, select, textarea');
        if (field) return String(field.value).trim();
        return cell.textContent.trim();
      };
      const code = readCell(0);
      const name = readCell(1);
      const requestedQuantity = parseFloat(readCell(2) || '0') || 0;
      let sentQuantity = 0;
      const sentField = cells[3] ? cells[3].querySelector('input, select, textarea') : null;
      if (sentField) sentQuantity = parseFloat(sentField.value || '0') || 0;
      else sentQuantity = parseFloat(readCell(3) || '0') || 0;
      return { code, name, requestedQuantity, sentQuantity };
    });

    const validProducts = products.filter(p => p.code || p.name);
    if (validProducts.length === 0) {
      Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'لا توجد بيانات صالحة للأصناف.' });
      return;
    }

    // compute shortages and excesses to store with invoice
    const shortages = [];
    const excesses = [];
    validProducts.forEach(p => {
      const diff = (Number(p.sentQuantity)||0) - (Number(p.requestedQuantity)||0);
      if (diff < 0) shortages.push({ code: p.code, name: p.name, qty: Math.abs(diff) });
      else if (diff > 0) excesses.push({ code: p.code, name: p.name, qty: diff });
    });

    const invoice = {
      branch,
      orderDate,
      section,
      products: validProducts,
      shortages,
      excesses,
      createdAt: new Date().toISOString()
      // invoiceNumber handled below depending on action
    };

    const docId = `${branch}_${orderDate}_${section}`;
    const invoiceRef = db.collection('invoices').doc(docId);

    try {
      const snapshot = await invoiceRef.get();
      if (snapshot.exists) {
        // يوجد بالفعل — اعرض الخيارات الثلاثية
        Swal.fire({
          title: 'تنبيه',
          text: 'تم العثور على فاتورة بنفس الفرع والتاريخ والقسم. ماذا تريد أن تفعل؟',
          icon: 'warning',
          showDenyButton: true,
          showCancelButton: true,
          confirmButtonText: 'تعديل',
          denyButtonText: 'حفظ جديد',
          cancelButtonText: 'إلغاء'
        }).then(async (result) => {
          try {
            if (result.isConfirmed) {
              // تعديل: حافظ على رقم الفاتورة السابق إن وُجد
              const existing = snapshot.data() || {};
              const toUpdate = Object.assign({}, invoice, { invoiceNumber: existing.invoiceNumber || nextInvoiceNumber });
              await invoiceRef.update(toUpdate);
              Swal.fire({
                title: '✅ تم التعديل',
                text: 'تم تعديل الفاتورة بنجاح.',
                icon: 'success',
                showDenyButton: true,
                confirmButtonText: 'موافق',
                denyButtonText: 'طباعة الفاتورة'
              }).then((res) => {
                if (res.isDenied) printInvoice(toUpdate);
              });
            } else if (result.isDenied) {
              // حفظ جديد برقم جديد
              const newInvoice = Object.assign({}, invoice, { invoiceNumber: nextInvoiceNumber });
              await db.collection('invoices').add(newInvoice);
              Swal.fire({
                title: '✅ تم الحفظ كفاتورة جديدة',
                text: `تم حفظ فاتورة جديدة بالرقم ${nextInvoiceNumber}.`,
                icon: 'success',
                showDenyButton: true,
                confirmButtonText: 'موافق',
                denyButtonText: 'طباعة الفاتورة'
              }).then((res) => {
                if (res.isDenied) printInvoice(newInvoice);
              });
              nextInvoiceNumber++;
            } else {
              Swal.fire('تم الإلغاء', 'لم يتم إجراء أي تغييرات.', 'info');
            }
          } catch (err) {
            console.error('Invoice action error:', err);
            Swal.fire('❌ خطأ', 'حدث خطأ أثناء معالجة الفاتورة.', 'error');
          }
        });
      } else {
        // لا يوجد — أنشئ وثيقة جديدة بنفس docId مع رقم الفاتورة الحالي
        const toSave = Object.assign({}, invoice, { invoiceNumber: nextInvoiceNumber });
        await invoiceRef.set(toSave);
        Swal.fire({
          title: 'تم',
          text: `تم إنشاء الفاتورة بنجاح برقم ${nextInvoiceNumber}!`,
          icon: 'success',
          showDenyButton: true,
          confirmButtonText: 'موافق',
          denyButtonText: 'طباعة الفاتورة'
        }).then((res) => {
          if (res.isDenied) printInvoice(toSave);
        });
        nextInvoiceNumber++;
      }
    } catch (err) {
      console.error('sendQuantities error:', err);
      Swal.fire('❌ خطأ', 'حدث خطأ أثناء التواصل مع قاعدة البيانات.', 'error');
    }
  }

  // جلب الأقسام من مجموعة 'catalog' وملء الـ select (يستخدم أسماء المستندات كشيتات)

      Swal.fire('❌ خطأ','فشل جلب الأقسام من الكتالوج. تحقق من الاتصال بقاعدة البيانات.','error');
    }
  }

  // ربط الزر الجديد
  const issueInvoiceBtn = document.getElementById('issueInvoiceBtn');
  if (issueInvoiceBtn) {
    issueInvoiceBtn.addEventListener('click', (e) => {
      e.preventDefault();
      loadSectionsFromCatalog();
    });
  }

  // زر لتحويل المستخدم إلى صفحة تحليلات الانتاج
  const btnOpenSummary = document.getElementById('btnOpenSummary');
  if (btnOpenSummary) {
    btnOpenSummary.addEventListener('click', (e) => {
      e.preventDefault();
      navigateWithRoles('summary.html');
    });
  }

  // ربط زر تحميل الجدول: يفعل العلم مؤقتًا، يعطل الزر أثناء التحميل، ثم يعيد التمكين
    const loadTableBtn = document.getElementById('loadTableBtn');
    if (loadTableBtn) {
      loadTableBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        // تمكين التحميل يدويًا
        allowLoadTable = true;
        loadTableBtn.disabled = true;
        loadTableBtn.textContent = '⏳ جارٍ التحميل...';
        try {
          await loadOrderData();
        } finally {
          allowLoadTable = false;
          loadTableBtn.disabled = false;
          loadTableBtn.textContent = '⬇️ عرض';
        }
      });
    }

    // Save draft of sent quantities to Firestore so user can come back later from any device
    const saveDraftBtn = document.getElementById('saveDraftBtn');
    if (saveDraftBtn) {
      saveDraftBtn.addEventListener('click', (e) => {
        e.preventDefault();
        saveDraftBranches();
      });
    }

    function _buildDraftDocId(branch, orderDate, section){
      // safe id
      return `draft_branches_${branch}_${orderDate}_${section}`.replace(/[^a-zA-Z0-9_\-]/g,'_');
    }

    async function saveDraftBranches(){
      const branch = branchSelect.value;
      const orderDate = orderDateInput.value;
      const section = sectionSelect.value;
  if(!branch || !orderDate || !section){ showToast('اختر الفرع والتاريخ والقسم ثم اضغط حفظ مؤقت','warning',3000); return; }
      const rows = Array.from(orderDataTable.querySelectorAll('tr'));
      const products = rows.map(row => {
        const code = row.querySelector('.item-code') ? row.querySelector('.item-code').value.trim() : (row.cells[0]?row.cells[0].textContent.trim():'');
        const name = row.querySelector('.item-name') ? row.querySelector('.item-name').value.trim() : (row.cells[1]?row.cells[1].textContent.trim():'');
        const requested = row.querySelector('.requested-qty') ? Number(row.querySelector('.requested-qty').value||0) : Number((row.cells[2]?row.cells[2].textContent:0)) || 0;
        const sentEl = row.querySelector('.sent-qty') ? row.querySelector('.sent-qty') : (row.cells[3]? row.cells[3].querySelector('input') : null);
        const sent = sentEl ? Number(sentEl.value || 0) : 0;
        return { code, name, requested, sent, sheet: row.dataset.sheet || section };
      }).filter(p=>p.code||p.name);
      const docId = _buildDraftDocId(branch, orderDate, section);
      try{
        await db.collection('drafts').doc(docId).set({ branch, orderDate, section, products, updatedAt: new Date().toISOString() });
        showToast('تم حفظ المسودة على الخادم', 'success', 2800);
      }catch(e){ console.error('saveDraftBranches',e); showToast('فشل حفظ المسودة على الخادم', 'error', 3800); }
    }

    function escapeDraftValue(value){
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function createDraftRow(product){
      const row = document.createElement('tr');
      row.dataset.sheet = (product.sheet || sectionSelect.value || '').toString().trim();
      row.innerHTML = `
        <td><input type="text" class="item-code" value="${escapeDraftValue(product.code)}"></td>
        <td><input type="text" class="item-name" value="${escapeDraftValue(product.name)}"></td>
        <td><input type="number" value="${Number(product.requested)||0}" min="0" class="requested-qty"></td>
        <td><input type="number" value="${Number(product.sent)||0}" min="0" class="sent-qty"></td>
        <td class="diff-cell">0</td>
        <td><button type="button" class="row-delete-btn" title="حذف">✖</button></td>
      `;
      orderDataTable.appendChild(row);
      attachRowDeleteAction(row);
      const requestedInput = row.querySelector('.requested-qty');
      const sentInput = row.querySelector('.sent-qty');
      [requestedInput, sentInput].forEach(input => {
        if (input) input.addEventListener('input', () => { updateRowDiff(row); updateAnalysisCards(); });
      });
      updateRowDiff(row);
      return row;
    }

    async function loadDraftBranches(){
      const branch = branchSelect.value;
      const orderDate = orderDateInput.value;
      const section = sectionSelect.value;
      if(!branch || !orderDate || !section) return;
      try{
        let products = [];
        if (section === 'all') {
          const snapshot = await db.collection('drafts')
            .where('branch', '==', branch)
            .where('orderDate', '==', orderDate)
            .get();
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data && Array.isArray(data.products)) {
              products = products.concat(data.products);
            }
          });
        } else {
          const docId = _buildDraftDocId(branch, orderDate, section);
          const snap = await db.collection('drafts').doc(docId).get();
          if (snap.exists) {
            const data = snap.data();
            if (data && Array.isArray(data.products)) {
              products = products.concat(data.products);
            }
          }
          const allDocId = _buildDraftDocId(branch, orderDate, 'all');
          const allSnap = await db.collection('drafts').doc(allDocId).get();
          if (allSnap.exists) {
            const allData = allSnap.data();
            if (allData && Array.isArray(allData.products)) {
              products = products.concat(allData.products.filter(p => {
                const sheet = (p.sheet||'').toString().trim().toLowerCase();
                return sheet === section || (!sheet && section === 'all');
              }));
            }
          }
        }
        if(!Array.isArray(products) || products.length===0) return;
        const rows = Array.from(orderDataTable.querySelectorAll('tr'));
        const map = new Map();
        products.forEach(p => {
          const code = (p.code||'').toString().trim().toLowerCase();
          const name = (p.name||'').toString().trim().toLowerCase();
          const sheet = (p.sheet||'').toString().trim().toLowerCase();
          if (code || name) {
            const key = `${sheet}|${code}`;
            const alt = `${sheet}|${name}`;
            if (!map.has(key) && key !== '|') map.set(key, p);
            if (!map.has(alt) && alt !== '|') map.set(alt, p);
            if (!map.has(code) && code) map.set(code, p);
            if (!map.has(name) && name) map.set(name, p);
          }
        });
        let restored = false;
        rows.forEach(row=>{
          const code = row.querySelector('.item-code') ? row.querySelector('.item-code').value.trim() : (row.cells[0]?row.cells[0].textContent.trim():'');
          const name = row.querySelector('.item-name') ? row.querySelector('.item-name').value.trim() : (row.cells[1]?row.cells[1].textContent.trim():'');
          const sheet = (row.dataset.sheet||'').toString().trim().toLowerCase();
          const lowerCode = code.toLowerCase();
          const lowerName = name.toLowerCase();
          const k1 = `${sheet}|${lowerCode}`;
          const k2 = `${sheet}|${lowerName}`;
          const found = map.get(k1) || map.get(k2) || map.get(lowerCode) || map.get(lowerName);
          if(found){
            const sentEl = row.querySelector('.sent-qty') ? row.querySelector('.sent-qty') : (row.cells[3]? row.cells[3].querySelector('input') : null);
            if(sentEl){ sentEl.value = found.sent || 0; restored = true; }
            updateRowDiff(row);
          }
        });

        products.forEach(p => {
          const code = (p.code||'').trim();
          const name = (p.name||'').trim();
          if (!code && !name) return;
          const expectedSheet = (p.sheet||section).toLowerCase();
          const lowerCode = code.toLowerCase();
          const lowerName = name.toLowerCase();
          const exists = rows.some(row => {
            const rowCode = row.querySelector('.item-code') ? row.querySelector('.item-code').value.trim() : (row.cells[0]?row.cells[0].textContent.trim():'');
            const rowName = row.querySelector('.item-name') ? row.querySelector('.item-name').value.trim() : (row.cells[1]?row.cells[1].textContent.trim():'');
            const rowSheet = (row.dataset.sheet||'').toString().trim().toLowerCase();
            if (section === 'all') {
              return (rowCode && rowCode.toLowerCase() === lowerCode) || (rowName && rowName.toLowerCase() === lowerName);
            }
            if (rowSheet === expectedSheet) {
              return (rowCode && rowCode.toLowerCase() === lowerCode) || (rowName && rowName.toLowerCase() === lowerName);
            }
            return false;
          });
          if (!exists) {
            createDraftRow(p);
            restored = true;
          }
        });

        if(restored){ showToast(section === 'all' ? 'تم استرجاع المسودات لجميع الأقسام' : 'تم استرجاع المسودة لهذا القسم', 'success', 2800); updateAnalysisCards(); }
      }catch(e){ console.error('loadDraftBranches',e); }
    }

      // Mobile view: builds a compact, touch-friendly summary for small screens
      function openMobileView(){
        try{
          const modal = document.getElementById('mobileViewModal');
          const content = document.getElementById('mobileViewContent');
          if(!modal || !content) return;
          const rows = Array.from(orderDataTable.querySelectorAll('tr'));
          if(rows.length===0){ content.innerHTML = '<div style="text-align:center;padding:12px;color:#ccc">لا توجد أصناف</div>'; }
          else{
            const html = rows.map(r=>{
              const code = (r.querySelector('.item-code') ? r.querySelector('.item-code').value : (r.cells[0]?r.cells[0].textContent:'')) || '';
              const name = (r.querySelector('.item-name') ? r.querySelector('.item-name').value : (r.cells[1]?r.cells[1].textContent:'')) || '';
              const req = r.querySelector('.requested-qty') ? Number(r.querySelector('.requested-qty').value||0) : Number(r.cells[2]?r.cells[2].textContent:0) || 0;
              const sentEl = r.querySelector('.sent-qty') ? r.querySelector('.sent-qty') : (r.cells[3]? r.cells[3].querySelector('input') : null);
              const sent = sentEl ? Number(sentEl.value||0) : Number(r.cells[3]?r.cells[3].textContent:0) || 0;
              const diff = sent - req;
              return `<div style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;gap:8px;align-items:center;justify-content:space-between;"><div style="flex:1;text-align:right"><div style="font-weight:800">${escapeHtml(name)}</div><div style="color:#aaa;font-size:0.95rem">${escapeHtml(code)}</div></div><div style="min-width:110px;text-align:center;font-weight:800;">${req} → ${sent}<div style="font-size:0.85rem;color:${diff<0? '#ffbbbb': (diff>0? '#baffc9':'#ccc')};">${diff}</div></div></div>`;
            }).join('');
            content.innerHTML = html;
          }
          modal.style.display = 'block';
        }catch(e){ console.error('openMobileView',e); }
      }
      function closeMobileView(){ const modal = document.getElementById('mobileViewModal'); if(modal) modal.style.display='none'; }
 </script>
