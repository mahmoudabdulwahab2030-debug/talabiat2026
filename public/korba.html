  <style>
    .container {
      --transition: 350ms;
--folder-W: 90px;
--folder-H: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 10px;
background: linear-gradient(135deg, #2c2c2c, #3a2f1d);
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      height: calc(var(--folder-H) * 1.7);
      position: relative;
      margin-bottom: 20px;
      
    }

    .folder {
      position: absolute;
      top: -20px;
      left: calc(50% - 60px);
      animation: float 2.5s infinite ease-in-out;
      transition: transform var(--transition) ease;
    }

    .folder:hover {
      transform: scale(1.05);
    }

    .folder .front-side,
    .folder .back-side {
      position: absolute;
      transition: transform var(--transition);
      transform-origin: bottom center;
    }

    .folder .back-side::before,
    .folder .back-side::after {
      content: "";
      display: block;
      background-color: white;
      opacity: 0.5;
      z-index: 0;
      width: var(--folder-W);
      height: var(--folder-H);
      position: absolute;
      transform-origin: bottom center;
      border-radius: 15px;
      transition: transform 350ms;
      z-index: 0;
    }

    .container:hover .back-side::before {
      transform: rotateX(-5deg) skewX(5deg);
    }

    .container:hover .back-side::after {
      transform: rotateX(-15deg) skewX(12deg);
    }

    .folder .front-side {
      z-index: 1;
    }

    .container:hover .front-side {
      transform: rotateX(-40deg) skewX(15deg);
    }

    .folder .tip {
      background: linear-gradient(135deg, #ff9a56, #ff6f56);
      width: 80px;
      height: 20px;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      position: absolute;
      top: -10px;
      z-index: 2;
    }

    .folder .cover {
      background: linear-gradient(135deg, #ffe563, #ffc663);
      width: var(--folder-W);
      height: var(--folder-H);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

      display: inline-block;
width: auto;
min-width: 70px;
max-width: 250px;

/* تحسين مظهر مودال الكتالوج */
.catalog-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(145deg, #1a1a1a, #202020);
  padding: 20px;
  display: grid;
  grid-template-rows: auto auto 1fr;
  gap: 15px;
  border-radius: 20px;
  z-index: 1000;
  width: 95%;
  max-width: 1000px;
  height: 85vh;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  animation: modalEnter 0.4s cubic-bezier(0.21, 1.02, 0.73, 1);
}

@keyframes modalEnter {
  0% {
    opacity: 0;
    transform: translate(-50%, -45%) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

    .replace(/\s+/g, '_')

    orderDate || '',
    item.sheet || '',
    item.code || '',
    item.name || '',
    String(item.rowIdx || '')
  ].map(normalizeIdPart).filter(Boolean);
  const id = parts.join('__').slice(0, 150);
  return id || db.collection(getOrdersCollectionName()).doc().id;
}

function setUploadBusy(state) {
  isUploading = state;
  [document.getElementById('uploadBtn'), document.getElementById('uploadAllBtn')].forEach(btn => {
    if (!btn) return;
    btn.disabled = state;
  });
}

// Utility
function escapeHtml(text) {
  if (!text) return '';
  const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

// Helper: commit operations in chunks to respect Firestore batch limits (500)
async function commitInBatches(writeOps = []) {
	const BATCH_LIMIT = 400; // leave margin under 500
	for (let i = 0; i < writeOps.length; i += BATCH_LIMIT) {
		const batch = db.batch();
		const chunk = writeOps.slice(i, i + BATCH_LIMIT);
		chunk.forEach(fn => fn(batch)); // each item is function that receives batch and schedules op
		await batch.commit();
	}
}

// Save changes made in editingData: replace existing orders for branch/date, then re-insert edited items
window.saveChanges = async function() {
	const date = editDateSpan.textContent || (orderDateInput && orderDateInput.value);
	if (!date) { Swal.fire('تنبيه','لا يوجد تاريخ للحفظ','warning'); return; }
	if (!editingData || !Array.isArray(editingData)) { Swal.fire('تنبيه','لا توجد تغييرات للحفظ','info'); return; }

	// confirm with user
	const res = await Swal.fire({
		title: 'حفظ التعديلات',
		html: `سيتم حفظ التعديلات لطلبية الفرع <strong>الكوربة</strong> بتاريخ <strong>${escapeHtml(date)}</strong>.<br>
			   هذا الإجراء سيستبدل بيانات الطلبية بالكامل كما لو أنّك أعدت رفع الملف.<br>هل تريد المتابعة؟`,
		icon: 'question',
		showCancelButton: true,
		confirmButtonText: 'نعم، احفظ التعديلات',
		cancelButtonText: 'إلغاء'
	});
	if (!res.isConfirmed) return;

	Swal.fire({ title: '🔄 جاري حفظ التعديلات...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

	try {
		// 1) جلب جميع مستندات orders لنفس الفرع والتاريخ لحذفها
		const toDeleteSnap = await db.collection('orders').where('branch','==','korba').where('orderDate','==',date).get();

		// Prepare delete ops
		const deleteOps = [];
		toDeleteSnap.forEach(doc => {
			deleteOps.push(batch => batch.delete(doc.ref));
		});

		// 2) Prepare insert ops from current editingData (only keep valid items)
		const insertOps = [];
		editingData.forEach(item => {
			// ensure shape: code,name,qty,notes,sheet
			const code = item.code || (item.name ? String(item.name).toLowerCase().replace(/\s+/g,'_') : '');
			const name = item.name || '';
			const qty = Number(item.qty) || 0;
			const notes = item.notes || '';
			const sheet = item.sheet || (currentSheetName || '');
			if (!name || qty <= 0) return; // skip invalid
			insertOps.push(batch => {
				const ref = db.collection('orders').doc();
				batch.set(ref, {
					code, name, qty, notes, sheet,
					branch: 'korba',
					orderDate: date,
					timestamp: firebase.firestore.FieldValue.serverTimestamp()
				});
			});
		});

		// Commit deletes then inserts in batches
		if (deleteOps.length) await commitInBatches(deleteOps);
		if (insertOps.length) await commitInBatches(insertOps);

		Swal.close();
		Swal.fire('✅ تم الحفظ', `تم حفظ ${insertOps.length} صنف للطّلبية بتاريخ ${date}`, 'success');

		// refresh UI: hide edit section and clear editingData
		editSection.style.display = 'none';
		editingData = [];
		editTableEl.innerHTML = '';
		// update table preview and status
		statusEl.textContent = `✅ تم حفظ التعديلات لطلبية ${date}`;
		// Optionally refresh all-orders view by emitting an event or instructing user to refresh that page.
		// We'll dispatch a custom event (other pages can listen if needed)
		window.dispatchEvent(new CustomEvent('orders-updated', { detail: { branch:'korba', orderDate: date } }));
	} catch (err) {
		console.error('saveChanges error:', err);
		Swal.close();
		Swal.fire('خطأ','فشل حفظ التعديلات. حاول مرة أخرى','error');
	}
};

  // دالة debounce بسيطة
function debounce(fn, wait = 160) {
  let t = null;
  const debounced = function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
  debounced.immediate = function(...args) { clearTimeout(t); fn.apply(this, args); };
  return debounced;
}

// الفعل الحقيقي للفلترة (بدون تأخير) — يُستخدم داخلياً
function applyEditSearchImmediate() {
  const q = (document.getElementById('editSearch')?.value || '').toLowerCase().trim();
  const rows = document.querySelectorAll('#editTable table.data-table tbody tr');
  if (!rows) return;
  let visibleCount = 0;
  rows.forEach(r => {
    r.classList.remove('match-highlight');
    r.style.display = '';
    if (!q) { visibleCount++; return; } // لا فلتر => اعرض الكل
    const code = (r.cells[0]?.textContent || '').toLowerCase();
    const name = (r.cells[1]?.textContent || '').toLowerCase();
    const notes = (r.cells[3]?.textContent || '').toLowerCase();
    const matched = code.includes(q) || name.includes(q) || notes.includes(q);
    r.style.display = matched ? '' : 'none';
    if (matched) { r.classList.add('match-highlight'); visibleCount++; }
  });
  // عرض عدد النتائج المؤقت في status (يمكن تعديله أو حذفه)
  const statusElLocal = document.getElementById('status');
  if (statusElLocal) {
    if (q) statusElLocal.textContent = `عرض ${visibleCount} نتيجة بحث عن "${q}"`;
    else statusElLocal.textContent = '';
  }
}

// دالة debounce للاستخدام مع حقل البحث
const debouncedApplyEditSearch = debounce(applyEditSearchImmediate, 140);

// ربط حقل البحث بالأحداث — ضع هذا داخل DOMContentLoaded بعد تعريف الدوال أعلاه
  const input = document.getElementById('editSearch');
  if (input) {
    input.addEventListener('input', () => debouncedApplyEditSearch());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        applyEditSearchImmediate();
      }
    });
  }

  // renderEditTable: same as before but table uses full width container and buttons are above it
  window.renderEditTable = function() {
    const container = document.getElementById('editTable');
    const buttonsContainer = document.getElementById('editSectionButtons');
    if (!container || !buttonsContainer) return;

    if (!editingData || editingData.length === 0) {
      container.innerHTML = '<p style="padding:12px;color:#ffd166;">لا توجد عناصر للتعديل.</p>';
      buttonsContainer.innerHTML = '';
      return;
    }

    const sections = {};
    editingData.forEach((it, idx) => {
      const sec = (it.sheet || 'عام').toString();
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push({ ...it, __idx: idx });
    });

    updateEditSectionButtons(sections);

    const keys = Object.keys(sections);
    if (keys.length === 0) { container.innerHTML = '<p style="padding:12px;color:#ffd166;">لا توجد عناصر.</p>'; return; }
    if (!currentEditSection || !sections[currentEditSection]) currentEditSection = keys[0];

    const items = sections[currentEditSection] || [];
    if (items.length === 0) { container.innerHTML = '<p style="padding:12px;color:#ffd166;">لا توجد عناصر لهذا القسم.</p>'; return; }

    let html = `<table class="data-table"><thead><tr><th>الكود</th><th>الصنف</th><th>الكمية</th><th>ملاحظات</th><th>حذف</th></tr></thead><tbody>`;
    items.forEach(item => {
      const code = escapeHtml(item.code || '');
      const name = escapeHtml(item.name || '');
      const qty = Number(item.qty) || 0;
      const notes = escapeHtml(item.notes || '');
      const newAttr = item.__new ? ' data-new="1"' : '';
      html += `<tr${newAttr}><td>${code}</td><td style="text-align:right">${name}</td><td><input type="number" class="qty-input" value="${qty}" min="0" onchange="updateQty(${item.__idx}, this.value)" /></td><td><input type="text" class="qty-input" value="${notes}" style="width:100%;padding:5px;" onchange="updateNotes(${item.__idx}, this.value)" placeholder="أضف ملاحظة..." /></td><td><button class="action-button secondary" onclick="deleteItem(${item.__idx})">🗑️</button></td></tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;

    // إعادة تطبيق فلتر البحث (إن يوجد) بعد بناء الجدول
    try { applyEditSearchImmediate(); } catch(e) { /* no-op */ }

    // إبراز الصف الجديد إذا وُجد
    setTimeout(() => highlightNewlyAdded(), 150);
  };

  // applyEditSearch: filter rows of the visible table using #editSearch value
  window.applyEditSearch = function() {
    const q = (document.getElementById('editSearch')?.value || '').toLowerCase().trim();
    const rows = document.querySelectorAll('#editTable table.data-table tbody tr');
    if (!rows) return;
    if (!q) { rows.forEach(r => r.style.display = ''); return; }
    rows.forEach(r => {
      const code = (r.cells[0]?.textContent || '').toLowerCase();
      const name = (r.cells[1]?.textContent || '').toLowerCase();
      const notes = (r.cells[3]?.textContent || '').toLowerCase();
      r.style.display = (code.includes(q) || name.includes(q) || notes.includes(q)) ? '' : 'none';
    });
  };

  // تأكد وجود دالة لإغلاق مودال الكتالوج (تستخدم من أزرار المودال)
  window.closeCatalogModal = function() {
    const modal = document.querySelector('.modal-overlay');
    if (!modal) return;
    modal.style.opacity = '0';
    setTimeout(() => { if (modal.parentNode) modal.parentNode.removeChild(modal); }, 180);
  };

  // current selected section
  let currentEditSection = null;

  // updateEditSectionButtons: render horizontal/wrapping buttons above table
  window.updateEditSectionButtons = function(sectionsObj) {
    const container = document.getElementById('editSectionButtons');
    if (!container) return;
    container.innerHTML = '';
    const keys = Object.keys(sectionsObj);
    keys.forEach((sec) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'section-btn';
      btn.dataset.section = sec;
      btn.innerHTML = `${sec} <span style="margin-left:8px;color:#fff;background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:8px;font-size:0.85em;">${sectionsObj[sec].length}</span>`;
      btn.onclick = () => { setEditSection(sec); };
      container.appendChild(btn);
    });
    if (!currentEditSection && keys.length) currentEditSection = keys[0];
    Array.from(container.children).forEach(b => b.classList.toggle('active', b.dataset.section === currentEditSection));
    const label = document.getElementById('currentSectionLabel');
    if (label) label.textContent = currentEditSection || (keys[0] || '');
  };

  window.setEditSection = function(section) {
    currentEditSection = section;
    const container = document.getElementById('editSectionButtons');
    if (container) Array.from(container.children).forEach(b => b.classList.toggle('active', b.dataset.section === section));
    const label = document.getElementById('currentSectionLabel');
    if (label) label.textContent = section;
    renderEditTable();
  };

  // ...existing code continues ...
}); // DOMContentLoaded
</script>
  <script src="/back-button.js" defer></script>
</body>
