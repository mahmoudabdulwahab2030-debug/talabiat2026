<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التقرير اليومي</title>
    <link href="style.css" rel="stylesheet" />
    <link href="/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
    body {
        background: #18191a;
        color: #f1f1f1;
        font-family: 'Cairo', Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        transition: background 0.5s cubic-bezier(.4,0,.2,1);
    }
    .container {
        background: #242526;
        margin: 0 auto;
        padding: 30px 18px;
        border-radius: 18px;
        max-width: 100vw;
        width: 100vw;
        box-shadow: 0 2px 24px 0 #000a, 0 0px 0px 0 #0000;
        transition: box-shadow 0.4s cubic-bezier(.4,0,.2,1), background 0.4s;
        animation: fadeInUp 0.7s cubic-bezier(.4,0,.2,1);
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px);}
        to { opacity: 1; transform: translateY(0);}
    }
    .main-menu {
        text-align: center;
        margin-top: 120px;
    }
    button {
        background: linear-gradient(90deg, #3a3b3c 60%, #23232a 100%);
        color: #fff;
        border: none;
        padding: 12px 32px;
        margin: 10px;
        border-radius: 10px;
        font-size: 1.2em;
        cursor: pointer;
        box-shadow: 0 2px 12px #0004;
        transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.18s cubic-bezier(.4,0,.2,1);
        will-change: background, color, box-shadow, transform;
        outline: none;
    }
    button:hover, button:focus {
        background: linear-gradient(90deg, #ffb300 60%, #ff1744 100%);
        color: #18191a;
        box-shadow: 0 8px 32px #ffb30044, 0 2px 12px #0004;
        transform: translateY(-2px) scale(1.04) rotate(-1deg);
    }
    input, select {
        background: #18191a;
        color: #fff;
        border: 1px solid #888;
        border-radius: 6px;
        padding: 6px 10px;
        margin: 4px;
        transition: border 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
        outline: 2px solid #ffb300;
        border-color: #ffb300;
        box-shadow: 0 0 8px #ffb30044;
    }
    input[type="date"], input[type="number"] {
        background: #2d2d2d;
        color: #fff700;
    }
    input[type="text"] {
        background: #23272b;
        color: #fff;
    }
    input[type="checkbox"] {
        accent-color: #ff1744;
    }
    table {
        width: 98vw;
        min-width: 900px;
        max-width: 99vw;
        margin: 20px auto;
        border-collapse: separate;
        border-spacing: 0;
        background: #23232a;
        border-radius: 16px;
        overflow: auto;
        box-shadow: 0 4px 32px #0008;
        table-layout: auto;
        animation: fadeInTable 0.7s cubic-bezier(.4,0,.2,1);
    }
    @keyframes fadeInTable {
        from { opacity: 0; transform: scale(0.98);}
        to { opacity: 1; transform: scale(1);}
    }
    th, td {
        border: 1px solid #444;
        padding: 14px 12px;
        text-align: center;
        vertical-align: middle;
        white-space: pre-line;
        word-break: break-word;
        font-size: 1.08em;
        transition: background 0.25s, color 0.25s;
        min-width: 120px;
        max-width: 600px;
    }
    th {
        background: linear-gradient(90deg, #333 60%, #23232a 100%);
        color: #ffb300;
        font-weight: bold;
        font-size: 1.1em;
        border-bottom: 2.5px solid #ffb300;
        letter-spacing: 0.5px;
        transition: background 0.25s, color 0.25s;
    }
    tr {
        transition: background 0.25s;
    }
    tr:nth-child(even) {
        background: #292929;
    }
    tr:nth-child(odd) {
        background: #23272b;
    }
    tr:hover td {
        background: #18191a;
        color: #ffb300;
        transition: background 0.25s, color 0.25s;
    }
    .form-row {
        display: flex;
        gap: 30px;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .actions {
        margin-top: 20px;
        text-align: left;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .alert {
        background: #ff1744;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        margin-top: 20px;
        display: none;
        animation: fadeInUp 0.5s;
    }
    ::-webkit-input-placeholder { color: #bdbdbd; }
    ::-moz-placeholder { color: #bdbdbd; }
    :-ms-input-placeholder { color: #bdbdbd; }
    ::placeholder { color: #bdbdbd; }

    @media (max-width: 1200px) {
        .container {
            max-width: 100vw;
            padding: 8px;
        }
        table {
            min-width: 700px;
            font-size: 0.98em;
        }
        th, td {
            min-width: 80px;
            font-size: 0.98em;
        }
    }
    @media (max-width: 900px) {
        .container {
            padding: 4px;
        }
        table {
            min-width: 500px;
            font-size: 0.92em;
        }
        th, td {
            min-width: 60px;
            font-size: 0.92em;
            padding: 8px 4px;
        }
    }
    @media (max-width: 700px) {
        .container {
            padding: 2px;
            margin: 0;
            max-width: 100vw;
        }
        table, th, td {
            font-size: 12px;
        }
        table {
            min-width: 320px;
            width: 99vw;
        }
        .form-row {
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }
        button {
            width: 100%;
            font-size: 1em;
        }
        .actions {
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }
    }
    @media print {
        body, .container {
            background: #fff !important;
            color: #000 !important;
        }
        .container {
            box-shadow: none !important;
        }
        table, th, td {
            background: #fff !important;
            color: #000 !important;
            border-color: #000 !important;
            white-space: normal !important;
            word-break: break-word !important;
        }
        button, .actions, .alert, input, select {
            display: none !important;
        }
        a, h2, h1 {
            color: #000 !important;
        }
    }
    </style>
    <!-- Firebase scripts -->
  <!-- طبقة بيانات Lovable (بديل Firestore) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lovable-data/firestore-compat.js"></script>
  <link rel="stylesheet" href="/mobile.css" data-ledoux-mobile="1" />
  <script src="/mobile.js"></script>
</head>
<body>
    <div class="container">
        <h2>التقرير اليومي</h2>
        <div id="success-alert" class="alert" style="display:none;">
            <span>تم الإرسال بنجاح!</span>
        </div>
        <form id="report-form" autocomplete="off">
            <div class="form-row">
                <label>التاريخ: <input type="date" name="report-date" id="report-date" required></label>
                <label>رقم التقرير: <input type="number" name="report-number" id="report-number" min="1" readonly required></label>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>الملاحظة</th>
                        <th>القسم</th>
                        <th>الإجراء المتخذ</th>
                        <th>تم التصحيح</th>
                        <th>لم يتم التصحيح</th>
                    </tr>
                </thead>
                <tbody id="rows-body">
                    <tr>
                        <td><input type="text" name="note[]" required></td>
                        <td>
                            <select name="department[]" onchange="if(this.value=='other'){this.nextElementSibling.style.display='inline-block'}else{this.nextElementSibling.style.display='none'}">
                                <option value="البيكري">البيكري</option>
                                <option value="الجارد مانجيه">الجارد مانجيه</option>
                                <option value="الغربي">الغربي</option>
                                <option value="الشرقي">الشرقي</option>
                                <option value="الالبان">الالبان</option>
                                <option value="الشيكولاته">الشيكولاته</option>
                                <option value="المخازن">المخازن</option>
                                <option value="التحميل">التحميل</option>
                                <option value="other">أخرى</option>
                            </select>
                            <input type="text" name="department_other[]" placeholder="حدد القسم" style="display:none;width:90px;">
                        </td>
                        <td><input type="text" name="action[]" required></td>
                        <td><input type="checkbox" name="corrected[]"></td>
                        <td><input type="checkbox" name="not_corrected[]"></td>
                    </tr>
                </tbody>
            </table>
            <div class="actions">
                <button type="button" id="add-row">إضافة صف</button>
                <button type="submit">ارسال الملاحظات</button>
                <button type="button" onclick="window.print()">طباعة</button>
            </div>
        </form>
    </div>
    <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA5nOr7oPJQydnZTUULmf2YxE33ppYz2Gw",
      authDomain: "ledoux-80b46.firebaseapp.com",
      projectId: "ledoux-80b46",
      storageBucket: "ledoux-80b46.appspot.com",
      messagingSenderId: "1020769543389",
      appId: "1:1020769543389:web:fc083525fd9675d9f86734",
      measurementId: "G-VJTW1W3D8D"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // جلب رقم التقرير التالي تلقائياً
    async function setNextReportNumber() {
        const snapshot = await db.collection("reports").orderBy("report_number", "desc").limit(1).get();
        let nextNumber = 1;
        if (!snapshot.empty) {
            nextNumber = (snapshot.docs[0].data().report_number || 0) + 1;
        }
        document.getElementById("report-number").value = nextNumber;
    }
    setNextReportNumber();

    // إضافة صف جديد
    document.getElementById("add-row").onclick = function() {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td><input type="text" name="note[]" required></td>
            <td>
                <select name="department[]" onchange="if(this.value=='other'){this.nextElementSibling.style.display='inline-block'}else{this.nextElementSibling.style.display='none'}">
                    <option value="البيكري">البيكري</option>
                    <option value="الجارد مانجيه">الجارد مانجيه</option>
                    <option value="الغربي">الغربي</option>
                    <option value="الشرقي">الشرقي</option>
                    <option value="الالبان">الالبان</option>
                    <option value="الشيكولاته">الشيكولاته</option>
                    <option value="المخازن">المخازن</option>
                    <option value="التحميل">التحميل</option>
                    <option value="other">أخرى</option>
                </select>
                <input type="text" name="department_other[]" placeholder="حدد القسم" style="display:none;width:90px;">
            </td>
            <td><input type="text" name="action[]" required></td>
            <td><input type="checkbox" name="corrected[]"></td>
            <td><input type="checkbox" name="not_corrected[]"></td>
        `;
        document.getElementById("rows-body").appendChild(row);
    };

    // حفظ التقرير في فايربيز
    document.getElementById("report-form").onsubmit = async function(e) {
        e.preventDefault();
        const form = e.target;
        const report_date = form["report-date"].value;
        const report_number = Number(form["report-number"].value);
        const notes = Array.from(form.querySelectorAll('input[name="note[]"]')).map(i => i.value);
        const departments = Array.from(form.querySelectorAll('select[name="department[]"]')).map(i => i.value);
        const departments_other = Array.from(form.querySelectorAll('input[name="department_other[]"]')).map(i => i.value);
        const actions = Array.from(form.querySelectorAll('input[name="action[]"]')).map(i => i.value);
        const correcteds = Array.from(form.querySelectorAll('input[name="corrected[]"]')).map(i => i.checked);
        const not_correcteds = Array.from(form.querySelectorAll('input[name="not_corrected[]"]')).map(i => i.checked);

        // حفظ كل صف كمستند منفصل
        for (let i = 0; i < notes.length; i++) {
            await db.collection("reports").add({
                report_date,
                report_number,
                note: notes[i],
                department: departments[i],
                department_other: departments_other[i],
                action: actions[i],
                corrected: correcteds[i],
                not_corrected: not_correcteds[i],
                created_at: new Date()
            });
        }
        document.getElementById("success-alert").style.display = "block";
        setNextReportNumber();
        form.reset();
    };
    </script>
</body>
</html>
