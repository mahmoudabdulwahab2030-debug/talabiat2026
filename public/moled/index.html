<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>المولد النبوي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="moled.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Cairo', Arial, sans-serif;
      background: linear-gradient(135deg, #23232a 0%, #2c2c2c 100%);
      color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      direction: rtl;
      text-align: center;
    }

    .page-card {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 32px);
      padding: 40px 30px;
      border-radius: 18px;
      background: rgba(15,18,20,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 20px;
      color: #ff6b7a;
      font-size: 2.5rem;
      font-weight: 800;
    }

    p {
      margin: 0 0 30px;
      line-height: 1.8;
      color: #d7d7d7;
      font-size: 1.1rem;
      max-width: 600px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
      width: 100%;
      max-width: 800px;
    }

    .nav-btn,
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,42,77,0.12);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      min-width: 160px;
      cursor: pointer;
    }

    .nav-btn:hover,
    .back-link:hover {
      background: rgba(255,42,77,0.24);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(255,42,77,0.2);
    }

    .nav-btn:active,
    .back-link:active {
      transform: translateY(0);
    }

    /* Tablets */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .page-card {
        padding: 32px 24px;
        max-height: calc(100vh - 24px);
        border-radius: 16px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 16px;
      }

      p {
        font-size: 1rem;
        margin-bottom: 24px;
      }

      .button-row {
        gap: 12px;
        margin-bottom: 24px;
      }

      .nav-btn,
      .back-link {
        padding: 12px 20px;
        font-size: 0.95rem;
        min-width: 140px;
      }
    }

    /* Small phones */
    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .page-card {
        padding: 24px 16px;
        max-height: calc(100vh - 16px);
        border-radius: 14px;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 14px;
      }

      p {
        font-size: 0.9rem;
        margin-bottom: 18px;
        line-height: 1.6;
      }

      .button-row {
        gap: 10px;
        margin-bottom: 18px;
        flex-direction: column;
      }

      .nav-btn,
      .back-link {
        padding: 11px 16px;
        font-size: 0.9rem;
        width: 100%;
        min-width: unset;
      }
    }

    /* Large screens */
    @media (min-width: 1200px) {
      body {
        padding: 24px;
      }

      .page-card {
        padding: 50px 50px;
        max-height: calc(100vh - 48px);
        max-width: 1300px;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 24px;
      }

      p {
        font-size: 1.2rem;
        margin-bottom: 36px;
        max-width: 700px;
      }

      .button-row {
        gap: 18px;
        margin-bottom: 36px;
      }

      .nav-btn,
      .back-link {
        padding: 16px 28px;
        font-size: 1.1rem;
        min-width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="page-card">
    <h1>المولد النبوي</h1>
    <p>مرحباً بك في صفحة المولد النبوي. اختر أحد الأقسام التالية للانتقال إليه.</p>
    <div class="button-row">
      <a class="nav-btn" href="item-moled.html">الأصناف</a>
      <a class="nav-btn" href="talabat-moled.html">التقارير</a>
      <a class="nav-btn" href="send-moled.html">إرسال فاتورة</a>
      <a class="nav-btn" href="moled-control.html">التحكم</a>

    </div>
    <a class="back-link" href="../main.html">◀ العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
