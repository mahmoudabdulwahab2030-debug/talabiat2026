<script>
    (function(){
        function setupNavUser(){
            const navUserBtn = document.getElementById('navUserBtn');
            const navUserMenu = document.getElementById('navUserMenu');
            const navLogout = document.getElementById('navLogoutBtn');
            const navUserName = document.getElementById('navUserName');
            const navUserNameBtn = document.getElementById('navUserNameBtn');
            const stored = localStorage.getItem('stock_loggedUser');
            if(navUserName) navUserName.textContent = stored ? stored.split(/\s+/)[0] : '-';
            if(!navUserBtn || !navUserMenu) return;

            function isOpen(){ return navUserMenu.style.display === 'block'; }
            function openMenu(open){
                const will = typeof open === 'boolean' ? open : !isOpen();
                navUserMenu.style.display = will ? 'block' : 'none';
                navUserMenu.setAttribute('aria-hidden', will ? 'false' : 'true');
                navUserBtn.setAttribute('aria-expanded', will ? 'true' : 'false');
                if(will){
                    // focus first item for keyboard
                    if(navUserNameBtn) navUserNameBtn.focus();
                }
            }

            navUserBtn.addEventListener('click', function(e){ e.stopPropagation(); openMenu(); });
            // close when clicking outside
            document.addEventListener('click', function(){ openMenu(false); });
            // keyboard support
            document.addEventListener('keydown', function(e){ if(e.key === 'Escape') openMenu(false); });

            // clicking username just closes menu (acts as first option)
            if(navUserNameBtn) navUserNameBtn.addEventListener('click', function(e){ e.stopPropagation(); openMenu(false); });

            if(navLogout) navLogout.addEventListener('click', function(){
                try{ if (window.activityLogger) activityLogger.logActivity('logout', location.pathname, {}); } catch(e){}
                localStorage.removeItem('stock_loggedUser');
                if(navUserName) navUserName.textContent = '-';
                if(navUserMenu) navUserMenu.style.display = 'none';
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setupNavUser);
        else setupNavUser();
    })();
</script>
