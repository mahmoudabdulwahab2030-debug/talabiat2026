  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5nOr7oPJQydnZTUULmf2YxE33ppYz2Gw",
      authDomain: "ledoux-80b46.firebaseapp.com",
      projectId: "ledoux-80b46",
      storageBucket: "ledoux-80b46.appspot.com",
      messagingSenderId: "1020769543389",
      appId: "1:1020769543389:web:fc083525fd9675d9f86734",
      measurementId: "G-VJTW1W3D8D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // early fallback so other pages calling addUploadNotification won't throw
    window.addUploadNotification = function(n){
      try{
        const key = 'upload_notifications_v1';
        const raw = localStorage.getItem(key) || '[]';
        const arr = JSON.parse(raw || '[]');
        n = n || {};
        if (!n.id) n.id = 'i_' + Math.random().toString(36).slice(2,9);
        n.ts = n.ts || Date.now();
        if (!arr.find(x => x.id === n.id)) arr.unshift(n);
        const now = Date.now();
        const filtered = arr.filter(x => x.ts && (now - x.ts) < 24*60*60*1000).slice(0,200);
        localStorage.setItem(key, JSON.stringify(filtered));
        try{ if (typeof updateWidgetFromStorage === 'function') updateWidgetFromStorage(); }catch(e){}
      }catch(e){ console.warn('addUploadNotification fallback', e); }
    };

    // Local helper to escape text safely for insertion
    function escapeForHtml(s){ return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    document.addEventListener('DOMContentLoaded', () => {
      const newsContainer = document.getElementById('newsContainer');
      if(!newsContainer) return;

      // Typing animation helper (character by character)
      function typeText(el, fullText, opts){
        opts = Object.assign({ speed: 48 }, opts || {});
        if (!el) return Promise.resolve();
        // Respect mobile static mode and user reduced-motion preference
        const isMobile = window.matchMedia('(max-width:600px)').matches;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (isMobile || reduced) { el.textContent = fullText || ''; el.classList.add('final-text'); return Promise.resolve(); }

        const text = String(fullText || el.textContent || '');
        el.textContent = '';
        const typedSpan = document.createElement('span'); typedSpan.className = 'typed-part';
        const untypedSpan = document.createElement('span'); untypedSpan.className = 'untyped-part';
        el.appendChild(typedSpan); el.appendChild(untypedSpan);
        let i = 0;
        return new Promise(resolve => {
          function step(){
            i++;
            typedSpan.textContent = text.slice(0, i);
            untypedSpan.textContent = text.slice(i);
            if (i < text.length) setTimeout(step, opts.speed);
            else {
              // finalize: replace with plain text and mark final
              setTimeout(()=> { try{ el.textContent = text; el.classList.add('final-text'); }catch(e){} resolve(); }, 90);
            }
          }
          step();
        });
      }

      db.collection('urgentNews').where('visibility', '==', 'visible').get()
        .then(snapshot => {
          if (!snapshot || snapshot.empty) {
            const empty = document.createElement('div');
            empty.className = 'news-item';
            empty.innerHTML = `<p style="color:#cfcfcf;">لا توجد أخبار حالياً</p>`;
            const sliderEl = newsContainer.querySelector('.slider-container');
            if (sliderEl) sliderEl.parentNode.insertBefore(empty, sliderEl); else newsContainer.appendChild(empty);
            // entrance animation
            setTimeout(()=> empty.classList.add('in'), 30);
            return;
          }

          snapshot.forEach(doc => {
            const news = doc.data() || {};
            const newsItem = document.createElement('div');
            newsItem.className = 'news-item';
            newsItem.innerHTML = `\n              <h4>${escapeForHtml(news.title)}</h4>\n              <p>${escapeForHtml(news.content)}</p>\n              <small>${escapeForHtml(news.date)}</small>\n            `;

            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';
            closeBtn.setAttribute('aria-label', 'إخفاء هذا الخبر');
            closeBtn.innerText = '✕';
            closeBtn.onclick = (e) => {
              e.stopPropagation();
              // play exit animation then remove
              newsItem.classList.remove('in');
              setTimeout(()=> { try{ newsItem.remove(); }catch(e){ newsItem.style.display='none'; } }, 320);
            };

            newsItem.appendChild(closeBtn);
            const sliderEl = newsContainer.querySelector('.slider-container');
            if (sliderEl) sliderEl.parentNode.insertBefore(newsItem, sliderEl); else newsContainer.appendChild(newsItem);
            // entrance animation + typing effect for text (title then content)
            setTimeout(()=>{
              newsItem.classList.add('in');
              try{
                const canAnimate = !window.matchMedia('(max-width:600px)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (canAnimate){
                  const h = newsItem.querySelector('h4');
                  const p = newsItem.querySelector('p');
                  Promise.resolve()
                    .then(()=> typeText(h, news.title, {speed: 48}))
                    .then(()=> typeText(p, news.content, {speed: 36}))
                    .catch(()=>{});
                }
              }catch(e){}
            }, 40);
          });
        })
        .catch(err => {
          console.error('Failed to load news', err);
          const empty = document.createElement('div');
          empty.className = 'news-item';
          empty.innerHTML = `<p style="color:#cfcfcf;">فشل جلب الأخبار</p>`;
          const sliderEl = newsContainer.querySelector('.slider-container');
          if (sliderEl) newsContainer.insertBefore(empty, sliderEl); else newsContainer.appendChild(empty);
        });
    });
  </script>

  <!-- slider init (restores slider functionality) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slides = Array.from(document.querySelectorAll('.slide'));
      const dotsContainer = document.getElementById('sliderDots');
      const prevCircle = document.querySelector('.bg-circle.prev');
      const nextCircle = document.querySelector('.bg-circle.next');
      const sliderEl = document.querySelector('.slider');
      if (!slides || slides.length === 0) return;

      let currentSlide = -1; const SLIDE_ANIM_MS = 1100;

      function setBgImages(idx) {
        if (!prevCircle || !nextCircle) return;
        const prevIdx = (idx - 1 + slides.length) % slides.length;
        const nextIdx = (idx + 1) % slides.length;
        const prevImg = slides[prevIdx].querySelector('img')?.src || '';
        const nextImg = slides[nextIdx].querySelector('img')?.src || '';
        prevCircle.style.backgroundImage = prevImg ? `url('${prevImg}')` : 'none';
        nextCircle.style.backgroundImage = nextImg ? `url('${nextImg}')` : 'none';
        prevCircle.style.opacity = prevImg ? '1' : '0';
        nextCircle.style.opacity = nextImg ? '1' : '0';
      }

      function adjustSliderHeight() {
        // Let the card/image determine the height naturally. Clear any inline heights.
        try { document.querySelectorAll('.card').forEach(c => c.style.minHeight = ''); } catch(e){}
        try { if (sliderEl) sliderEl.style.minHeight = ''; } catch(e){}
      }

      function showSlide(idx) {
        if (!slides || slides.length === 0) return;
        if (idx === currentSlide) return;
        const prev = (currentSlide >=0 && slides[currentSlide]) ? slides[currentSlide] : null;
        const next = slides[idx];

        try{
          // mark outgoing
          if (prev){ prev.classList.remove('incoming'); prev.classList.add('outgoing'); prev.classList.remove('active'); }
          // prepare next
          if (next){ next.classList.remove('outgoing'); next.classList.add('incoming'); next.classList.add('active'); }

          if (dotsContainer) Array.from(dotsContainer.children).forEach((dot, i) => dot.classList.toggle('active', i === idx));
          setBgImages(idx);
          setTimeout(adjustSliderHeight, 60);

          // cleanup after animation finishes
          setTimeout(()=>{
            if (prev) prev.classList.remove('outgoing');
            if (next) next.classList.remove('incoming');
          }, SLIDE_ANIM_MS + 60);

          // add subtle tilt to bg circles for motion
          try {
            if (prevCircle) prevCircle.style.transform = 'translateY(-6%) scale(1.04) rotate(-4deg)';
            if (nextCircle) nextCircle.style.transform = 'translateY(-6%) scale(1.04) rotate(4deg)';
            if (prevCircle) prevCircle.style.filter = 'blur(10px) saturate(1.05) opacity(.6)';
            if (nextCircle) nextCircle.style.filter = 'blur(10px) saturate(1.05) opacity(.6)';
          } catch(e) { /* ignore */ }
        }catch(e){ console.warn('showSlide failed', e); }

        currentSlide = idx;
      }

      if (dotsContainer && dotsContainer.children.length === 0) {
        slides.forEach((_, i) => {
          const dot = document.createElement('span');
          dot.className = 'slider-dot' + (i === 0 ? ' active' : '');
          dot.onclick = () => showSlide(i);
          dotsContainer.appendChild(dot);
        });
      }

      // ensure images trigger height adjustment when they load
      slides.forEach((s, i) => {
        const img = s.querySelector('img');
        if (img) img.addEventListener('load', () => { if (i === currentSlide) adjustSliderHeight(); });
      });

      // show first slide with animation
      showSlide(0);
      // automatic rotation with pause-on-hover
      let sliderPaused = false;
      let sliderAuto = setInterval(() => showSlide((currentSlide + 1) % slides.length), 4200);
      if (sliderEl) {
        sliderEl.addEventListener('mouseenter', ()=> { sliderPaused = true; clearInterval(sliderAuto); });

      // utility: read roles from either localStorage keys used by login or URL

      async function resolveAndSetWelcome(){
        // first prefer stored username

        // next try to resolve via stored userUid (document id)

      let trialInterval = null;
      let trialExpiredHandled = false;

      function formatTrialDuration(ms) {
        if (!ms || ms <= 0) return 'انتهت';
        const days = Math.floor(ms / 86400000);
        const hours = Math.floor((ms % 86400000) / 3600000);
        const minutes = Math.floor((ms % 3600000) / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        return `${days} يوم ${hours} س ${minutes} د ${seconds} ث`;
      }

      function showTrialNotice(text, expired) {
        const notice = document.getElementById('trialNotice');
        if (!notice) return;
        notice.style.display = 'block';
        notice.classList.toggle('expired', !!expired);
        notice.innerHTML = text;
      }

      function hideTrialNotice() {
        const notice = document.getElementById('trialNotice');
        if (!notice) return;
        notice.style.display = 'none';
        notice.classList.remove('expired');
        notice.innerHTML = '';
      }

      function logoutDueToTrial() {
        if (trialExpiredHandled) return;
        trialExpiredHandled = true;
        clearInterval(trialInterval);
        showTrialNotice('انتهت فترة تجربتك. سيتم تسجيل الخروج الآن.', true);
        setTimeout(() => {
          localStorage.removeItem('userCode');
          localStorage.removeItem('username');
          localStorage.removeItem('userUid');
          localStorage.removeItem('userRoles');
          window.location.href = 'index.html';
        }, 2600);
      }

      async function initTrialCountdown() {
        const userCode = localStorage.getItem('userCode');
        const username = localStorage.getItem('username');
        if (!userCode || typeof db === 'undefined') return;

        try {
          let doc = await db.collection('users').doc(userCode).get();
          if (!doc.exists && username) {
            const q = await db.collection('users').where('name', '==', username).limit(1).get();
            if (!q.empty) doc = q.docs[0];
          }
          if (!doc.exists) return;

          const data = doc.data() || {};
          const expiresAt = data.trialExpiresAt ? (data.trialExpiresAt.toDate ? data.trialExpiresAt.toDate() : new Date(data.trialExpiresAt.seconds * 1000)) : null;
          if (!expiresAt) return;

          const updateCountdown = () => {
            const diff = expiresAt.getTime() - Date.now();
            if (diff <= 0) {
              showTrialNotice('انتهت فترة التجربة الخاصة بك.', true);
              logoutDueToTrial();
              return;
            }
            showTrialNotice(`تبقى في فترة التجربة: <span class="highlight">${formatTrialDuration(diff)}</span>`, false);
          };

          updateCountdown();
          clearInterval(trialInterval);
          trialInterval = setInterval(updateCountdown, 1000);
        } catch (err) {
          console.warn('initTrialCountdown failed', err);
        }
      }

      async function checkForcedLogout() {
        const userCode = localStorage.getItem('userCode');

        try {
          let userRef = db.collection('users').doc(userCode);

          setTimeout(() => logout(), 2800);
        } catch (err) {
          console.warn('checkForcedLogout failed', err);
        }

      // logout function
      function logout() {
        try{ if (window.activityLogger) activityLogger.logActivity('logout', '/main.html', {}); } catch(e){}
        localStorage.removeItem('userCode');
        localStorage.removeItem('username');
        localStorage.removeItem('userUid');
        localStorage.removeItem('userRoles');
        window.location.href = 'index.html';

      document.addEventListener('DOMContentLoaded', () => {
        resolveAndSetWelcome();
        initTrialCountdown();
        checkForcedLogout();
        const btn = document.getElementById('viewPermBtn');
        if (btn) btn.addEventListener('click', openPermModal);

        // initialize upload notifications UI
        try { initUploadNotifications(); } catch(e) { console.warn('initUploadNotifications failed', e); }
      });

    <!-- Upload notifications: local storage + UI (24h TTL, cycling, expand on click) -->
    <script>
      const UPLOAD_NOTIF_KEY = 'upload_notifications_v1';
      const UPLOAD_TTL_MS = 24 * 60 * 60 * 1000; // 24 hours
      let _cycleTimer = null; let _cycleIndex = 0; let _newsBarTimer = null; let _barIndex = 0;

      // Arabic labels for branches
      const BRANCH_LABELS = { korba: 'الكوربة', dokki: 'الدقي', tagamo3: 'التجمع', obour: 'العبور' };

      function loadStoredNotifs(){
        try{
          const raw = localStorage.getItem(UPLOAD_NOTIF_KEY) || '[]';
          let arr = JSON.parse(raw);
          const now = Date.now();
          arr = (arr||[]).filter(n=> (n.ts && (now - n.ts) < UPLOAD_TTL_MS));
          arr.sort((a,b)=> b.ts - a.ts);
          localStorage.setItem(UPLOAD_NOTIF_KEY, JSON.stringify(arr));
          return arr;
        }catch(e){ console.warn('loadStoredNotifs failed', e); return []; }
      }

      function saveNotifs(arr){ try{ localStorage.setItem(UPLOAD_NOTIF_KEY, JSON.stringify(arr)); }catch(e){console.warn(e);} }

      function getBranchLabel(code){ try{ if (!code) return 'فرع غير معروف'; if (BRANCH_LABELS[code]) return 'فرع ' + BRANCH_LABELS[code]; return 'فرع ' + code; }catch(e){return code||'فرع غير معروف';} }

      function addUploadNotification(n){
        try{
          if (!n || !n.id) n.id = 'i_' + Math.random().toString(36).slice(2,9);
          n.ts = n.ts || Date.now();
          // load and dedupe per branch: keep latest per branch; if exists -> mark edited
          let arr = loadStoredNotifs();
          const existingIndex = arr.findIndex(x => x.branch && n.branch && x.branch === n.branch);
          let wasEdited = false;
          if (existingIndex !== -1){
            // update existing entry with latest info and mark as edited
            const existing = arr[existingIndex];
            const merged = Object.assign({}, existing, n, { edited: true, ts: n.ts, orderDate: n.orderDate || existing.orderDate });
            // remove old instance and put merged at front
            arr.splice(existingIndex, 1);
            arr.unshift(merged);
            wasEdited = true;
            n = merged;
          } else {
            arr.unshift(n);
          }

          // enforce TTL and unique-by-branch and max length
          const now = Date.now();
          const filtered = [];
          for (const x of arr){
            if (!(x.ts && (now - x.ts) < UPLOAD_TTL_MS)) continue;
            if (!filtered.find(u => u.branch === x.branch)) filtered.push(x);
            if (filtered.length >= 200) break;
          }
          saveNotifs(filtered);
          updateWidgetFromStorage();
          // show transient bar only for newly added or updated notifications
          const display = getBranchLabel(n.branch);
          const text = `قام ${display} بتحميل طلبيته ليوم ${n.orderDate || formatDate(n.ts)}`;
          showTransientUploadBar(text);
        }catch(e){ console.warn('addUploadNotification', e); }
      }

      function formatDate(ts){ try{ const d = new Date(ts); return d.toLocaleString('ar-EG'); }catch(e){ return ''; } }

      // helper to animate label text changes
      function animateLabelText(label, newText){
        if (!label) return;
        if (label.textContent === newText) return; // nothing to do
        // if already animating, just set text after a short timeout to avoid queues
        if (label._animating){ setTimeout(()=>{ label.textContent = newText; }, 300); return; }
        label._animating = true;
        label.classList.add('label-fade-out');
        const onEnd = (ev)=>{
          if (ev.propertyName !== 'opacity') return;
          label.removeEventListener('transitionend', onEnd);
          label.classList.remove('label-fade-out');
          label.textContent = newText;
          // small frame then animate back in
          requestAnimationFrame(()=>{
            label.classList.add('label-fade-in');
            // remove class after next frame so future transitions work
            requestAnimationFrame(()=>{ label.classList.remove('label-fade-in'); label._animating = false; });
          });
        };
        label.addEventListener('transitionend', onEnd);
      }

      function updateWidgetFromStorage(){
        const arr = loadStoredNotifs();
        const label = document.getElementById('uploadWidgetLabel');
        const badge = document.getElementById('uploadWidgetBadge');
        if (!label || !badge) return;
        if (!arr || arr.length===0){ animateLabelText(label, '🔔 لا توجد إشعارات حديثة'); badge.style.display='none'; stopCycling(); return; }
        badge.textContent = String(arr.length); badge.style.display='inline-flex';
        // show the first (or current index) item
        _cycleIndex = _cycleIndex % arr.length;
        const cur = arr[_cycleIndex] || arr[0];
        const display = getBranchLabel(cur.branch);
        const odLabel = cur.orderDate || formatDate(cur.ts);
        animateLabelText(label, `🔔 قام ${display} بتحميل طلبيته ليوم ${odLabel}`);
        // start cycling if many (widget)
        if (arr.length > 1) startCycling(); else stopCycling();
        // start/stop the bottom news bar cycle (show each stored notification transiently)
        if (arr.length > 0) startNewsBarCycle(); else stopNewsBarCycle();
      }

      function startCycling(){ stopCycling(); _cycleTimer = setInterval(()=>{ const arr = loadStoredNotifs(); if (!arr || arr.length<=1) { stopCycling(); return; } _cycleIndex = (_cycleIndex + 1) % arr.length; updateWidgetFromStorage(); }, 3000); }
      function stopCycling(){ if (_cycleTimer){ clearInterval(_cycleTimer); _cycleTimer = null; } }

      function startNewsBarCycle(){ stopNewsBarCycle(); const arr = loadStoredNotifs(); if (!arr || arr.length===0) return; _barIndex = _barIndex % arr.length; _newsBarTimer = setInterval(()=>{ const a = loadStoredNotifs(); if (!a || a.length===0) { stopNewsBarCycle(); return; } _barIndex = (_barIndex + 1) % a.length; const cur = a[_barIndex] || a[0]; const od = cur.orderDate || formatDate(cur.ts); showTransientUploadBar(`قام ${getBranchLabel(cur.branch)} بتحميل طلبيته ليوم ${od}`); }, 3000); }
      function stopNewsBarCycle(){ if (_newsBarTimer){ clearInterval(_newsBarTimer); _newsBarTimer = null; } }

      // Expand modal
      function renderUploadModal(){
        let modal = document.getElementById('uploadModal');
        if (!modal){ modal = document.createElement('div'); modal.id = 'uploadModal'; modal.innerHTML = `<div class="panel" role="dialog" aria-modal="true"><h3>الإشعارات خلال 24 ساعة</h3><div id="uploadList"></div><div class="actions"><button class="clear-btn" id="clearUploadNotifs">مسح</button><button class="close-btn" id="closeUploadModal">إغلاق</button></div></div>`; document.body.appendChild(modal);
          modal.addEventListener('click', (ev)=>{ if (ev.target === modal) closeUploadModal(); });
          modal.querySelector('#closeUploadModal').addEventListener('click', closeUploadModal);
          modal.querySelector('#clearUploadNotifs').addEventListener('click', ()=>{ saveNotifs([]); updateWidgetFromStorage(); renderUploadList(); });
        }
        renderUploadList();
        return modal;
      }

      function renderUploadList(){
        const listEl = document.getElementById('uploadList');
        if (!listEl) return;
        const arr = loadStoredNotifs();
        listEl.innerHTML = '';
        if (!arr || arr.length===0) { listEl.innerHTML = '<p style="color:#cfcfcf">لا توجد إشعارات</p>'; return; }
        arr.forEach(n => {
          const item = document.createElement('div'); item.className = 'upload-list-item';
          const left = document.createElement('div');
          const branchLabel = escapeForHtml(getBranchLabel(n.branch));

            // build list of available keys excluding metadata and id/sheet

  <script>
    // Persist roles from URL to localStorage so other pages keep the same context
    const rolesParamMain = new URLSearchParams(window.location.search).get("roles");
    if (rolesParamMain) localStorage.setItem('roles', rolesParamMain);

    // Roles array from URL (used to hide buttons immediately)
    const rolesFromUrl = new URLSearchParams(window.location.search).get("roles")?.split(",") || [];

    const roleMap = {
      btnKorba: "korba_page",
      btnDokki: "dokki_page",
      btnTagamo3: "tagamo3_page",
      btnObour: "obour_page",
      btnAll: "all_orders_page",
      btnUpload: "upload_page",
      btnStorage: "storage_page",
      btnDelivery: "delivery_page",
      btnReservation: "reservation_page",
      btnAdmin: "admin_page",
      btnSendToBranches: "send_to_branches_page",
      btnAllReservations: "all_reservations_page",
      btnQuality: "quality_page", // زر صفحة الجودة الجديد
      btnBestSweet: "best_sweet_page" // زر بيست سويت الجديد
    };

    // Hide buttons on load if roles do not include required permission
    window.addEventListener('load', () => {
      // If rolesFromUrl is empty, hide all permissioned buttons
      const hasRoles = rolesFromUrl.length > 0 && rolesFromUrl[0] !== "";
      // Some buttons should be available always regardless of roles
      const alwaysEnabled = ['btnObour'];
      Object.entries(roleMap).forEach(([id, role]) => {
        const el = document.getElementById(id);
        if (!el) return;
        // keep always-enabled items active
        if (alwaysEnabled.includes(id)) { el.classList.remove('perm-locked'); el.removeAttribute('aria-disabled'); return; }
        if (!hasRoles || (!rolesFromUrl.includes('all') && !rolesFromUrl.includes(role))) {
          // mark element as visually locked rather than removing it from layout
          el.classList.add('perm-locked');
          el.setAttribute('aria-disabled', 'true');
          // make it unfocusable by keyboard and store original tabindex if present
          try { el.dataset._origTabindex = el.getAttribute('tabindex'); } catch(e){}
          try { el.setAttribute('tabindex', '-1'); } catch(e){}

          // prevent navigation or activation via click, auxclick (middle click), or keyboard
          const preventer = (ev) => { try{ ev.preventDefault(); ev.stopImmediatePropagation(); }catch(e){}; showNoPermissionToastFor(el); };
          const keyPreventer = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { try{ ev.preventDefault(); ev.stopImmediatePropagation(); }catch(e){}; showNoPermissionToastFor(el); } };
          const auxPreventer = (ev) => { try{ ev.preventDefault(); ev.stopImmediatePropagation(); }catch(e){}; showNoPermissionToastFor(el); };

          // ensure we don't attach multiple handlers by attaching named functions once
          // attach in capture phase to run before other listeners and stop other handlers
          el.addEventListener('click', preventer, { passive: false, capture: true });
          el.addEventListener('auxclick', auxPreventer, { passive: false, capture: true });
          el.addEventListener('keydown', keyPreventer, { passive: false, capture: true });

          // neutralize inline onclick handlers (store original for debugging or future restore)
          if (el.hasAttribute && el.hasAttribute('onclick')) {
            try { el.dataset.originalOnclick = el.getAttribute('onclick'); } catch(e){}
            try { el.setAttribute('onclick', 'return false;'); } catch(e){}
          }

          // neutralize title to give quick hint and preserve original title
          try{ let hadTitle = false; if (el.hasAttribute && el.hasAttribute('title')) { el.dataset.originalTitle = el.getAttribute('title'); hadTitle = true; } if (hadTitle) { try{ el.setAttribute('title', 'غير مصرح'); }catch(e){} } }catch(e){}

          // If it's an anchor, preserve the original href then neutralize it so that
          // right-click/context-copy still works (original preserved in dataset)
          if (el.tagName === 'A' && el.hasAttribute('href')) {
            try { el.dataset.originalHref = el.getAttribute('href'); } catch(e){}
            try { el.setAttribute('href', '#'); } catch(e){}
          }
        }
      });
    });

    // Append roles query param to internal links and buttons that use location.href
    function attachRolesToNavLinks() {
      const stored = localStorage.getItem('roles');
      if (!stored) return;
      document.querySelectorAll('a').forEach(a => {
        if (a.classList && a.classList.contains('perm-locked')) return;
        const href = a.getAttribute('href');
        if (!href) return;
        if (/^https?:\/\//i.test(href) || href.includes('roles=')) return;
        const sep = href.includes('?') ? '&' : '?';
        a.setAttribute('href', href + sep + 'roles=' + encodeURIComponent(stored));
      });
      document.querySelectorAll('button[onclick]').forEach(btn => {
        if (btn.classList && btn.classList.contains('perm-locked')) return;
        const onclick = btn.getAttribute('onclick');
        const m = onclick && onclick.match(/location\\.href\s*=\s*['"]([^'"]+)['"]/);
        if (!m) return;
        let url = m[1];
        if (/^https?:\/\//i.test(url) || url.includes('roles=')) return;
        const sep = url.includes('?') ? '&' : '?';
        const newUrl = url + sep + 'roles=' + encodeURIComponent(stored);
        btn.setAttribute('onclick', `location.href='${newUrl}'`);
      });
    }

    // Show a simple temporary toast when a locked element is activated
    function showNoPermissionToastFor(el){
      try{
        // prefer preserved original title (if we saved it), then aria-label, then visible text, then title, then id
        let rawLabel = '';
        try{ rawLabel = (el && el.dataset && el.dataset.originalTitle) || ''; }catch(e){}
        try{
          if (!rawLabel && el && el.getAttribute){
            const aria = el.getAttribute('aria-label');
            const text = (el.textContent || el.innerText || '').trim();
            const titleAttr = el.getAttribute('title');
            rawLabel = aria || (text && text.length ? text : '') || titleAttr || el.id || '';
          }
        }catch(e){}
        const label = rawLabel || 'هذا العنصر';
        const msg = `ليس لديك صلاحية الدخول إلى ${label}`;
        let toast = document.querySelector('.perm-toast');
        if (!toast){ toast = document.createElement('div'); toast.className = 'perm-toast'; document.body.appendChild(toast); }
        toast.innerHTML = `<span>${escapeForHtml(msg)}</span>`;
        requestAnimationFrame(()=> toast.classList.add('show'));
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(()=> { toast.classList.remove('show'); }, 2600);
      }catch(e){ console.warn('showNoPermissionToastFor failed', e); }
    }

    document.addEventListener('DOMContentLoaded', attachRolesToNavLinks);
  </script>

        // Create chat button (next to suggest button)
        const chatBtn = document.createElement('button'); chatBtn.id = 'chatBtn'; chatBtn.title = 'تواصل مع المستخدمين'; chatBtn.setAttribute('aria-label','تواصل مع المستخدمين');
        chatBtn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" aria-hidden="true"><path d="M2 21l1.5-5.5C3.9 14 5 13 6.5 13H7V7C7 5.3 8.3 4 10 4h4c1.7 0 3 1.3 3 3v6c0 1.1-.9 2-2 2h-1l-4 4H6c-1.1 0-2-.9-2-2z" fill="#fff" opacity="0.98"/></svg><span class="unread-count"></span>`;
        document.body.appendChild(chatBtn);
        chatBtn.style.position = 'fixed'; chatBtn.style.left = '86px'; chatBtn.style.bottom = '18px';

        // Local helpers for seen/unread state (client-side per user)
        const _seenKey = 'seenSugReplies';
        window.getUserCode = function(){ return localStorage.getItem('userCode') || localStorage.getItem('username') || null; };
        window.getSeenSet = function(){ try{ return new Set(JSON.parse(localStorage.getItem(_seenKey) || '[]')); }catch(e){ return new Set(); } };
        window.setSeenSet = function(s){ try{ localStorage.setItem(_seenKey, JSON.stringify([...s])); }catch(e){} };
        window.updateSuggestBadge = function(count){ if (!btn) return; const span = btn.querySelector('.unread-count'); if (!span) return; span.textContent = count>99? '99+' : String(count); if (count>0) btn.classList.add('has-unread'); else btn.classList.remove('has-unread'); };

        // Chat unread subscription: listens for messages addressed to current user that are not read
        function updateChatBadge(count){ if (!chatBtn) return; const s = chatBtn.querySelector('.unread-count'); if (!s) return; s.textContent = count>99? '99+' : String(count); if (count>0) chatBtn.classList.add('has-unread'); else chatBtn.classList.remove('has-unread'); }
        function subscribeChatUnread(){ const me = window.getUserCode(); if (!me) return; try{ db.collection('chat_messages').where('to','==', me).where('read','==', false).onSnapshot(snap => { updateChatBadge(snap.size || 0); }, e => console.warn('chat unread sub failed', e)); }catch(e){ console.warn('subscribeChatUnread failed', e); } }
        subscribeChatUnread();

        // click navigates to chat page
        chatBtn.addEventListener('click', ()=>{ window.location.href = 'conversation.html'; });

        // keep it visible/positioned after layout changes
        window.addEventListener('resize', ()=>{ btn.style.left = '18px'; btn.style.bottom = '18px'; });

        // Expose for manual/testing use and provide an opt-in automated test when ?testSuggest=1
        try{ window.openSuggestModal = openSuggestModal; }catch(e){};

        function subscribeToReplies(){ const u = getUserCode(); if (!u) return; try{ db.collection('sug').where('userCode','==',u).onSnapshot(snap=>{ const seen = getSeenSet(); const unread = []; snap.forEach(doc=>{ const d = doc.data(); if (d && d.reply && d.reply.text && !seen.has(doc.id)) unread.push({ id: doc.id, data: d }); }); window._sug_unread_docs = unread; updateSuggestBadge(unread.length); }, e=> console.warn('subscribeToReplies failed', e)); }catch(e){ console.warn('subscribeToReplies init failed', e); } }
        // start subscription (if user authenticated info exists in localStorage)
        subscribeToReplies();

        // keep it visible/positioned after layout changes
        window.addEventListener('resize', ()=>{ btn.style.left = '18px'; btn.style.bottom = '18px'; });

        // Expose for manual/testing use and provide an opt-in automated test when ?testSuggest=1
        try{ window.openSuggestModal = openSuggestModal; }catch(e){}
        (function maybeAutoTest(){
          try{
            const params = new URLSearchParams(location.search);
            if (params.get('testSuggest') === '1'){
              console.log('[suggest] test mode enabled: opening modal and auto-submitting a test suggestion');
              openSuggestModal();
              setTimeout(()=>{
                const ta = document.getElementById('sugTxt');
                if (ta){
                  ta.value = 'اختبار تلقائي: هذا اقتراح تجريبي للتحقق من وظيفة الاقتراحات.';
                  const confirmBtn = document.querySelector('.swal2-confirm');
                  if (confirmBtn){
                    // click confirm to trigger preConfirm + submit
                    confirmBtn.click();
                    console.log('[suggest] auto-submitted the test suggestion (check Firestore /suggestions.html)');
                  } else console.warn('[suggest] could not find confirm button');
                } else console.warn('[suggest] could not find textarea to auto-fill');
              }, 520);
            }
          }catch(e){ console.warn('auto-test failed', e); }
        })();
      });
    })();
  </script>

</body>
